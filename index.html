#savebar .btn{border-radius:999px}
#savebar .btn.primary{background:var(--accent);border-color:var(--accent)}
#toast{background:linear-gradient(135deg,#17191e,#2a2e36);border-radius:999px}
.gate-card{border-radius:26px;border:1px solid var(--glass-line);box-shadow:0 24px 70px rgba(17,20,28,.1)}
.gate-mk{border-radius:50%!important;background:var(--surface)!important;color:var(--accent)!important;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 35%,transparent),0 0 0 7px color-mix(in srgb,var(--accent) 9%,transparent)}
.gate-mk svg.i{color:var(--accent)!important}
.gate-card h1::after{content:"";display:inline-block;width:.22em;height:.22em;margin-left:.08em;border-radius:50%;background:var(--accent)}
.gate-tabs button[aria-selected=true]{background:linear-gradient(135deg,#17191e,#2a2e36);color:#fff}

.stat .shift span,.stat .ppl{overflow-wrap:anywhere;min-width:0}
.stat{min-width:0}
@media (max-width:900px){.hero,.c-page .hero{width:calc(100% - 16px);border-radius:24px;margin-top:8px}.hero::after{font-size:72px;bottom:-14px}}
@media (max-width:760px){
  .gnav{flex-direction:column;gap:6px}.ng{height:auto;overflow-x:auto}
  .gnav button{height:34px;padding:0 10px;font-size:13.5px}
  .hero-in{padding-block:24px 0}.hero h1{font-size:28px}
  .subtabs{margin:18px 0 16px}
}

/* ===== v15: 블랙 / 화이트 ===== */
:root{
  --accent:#111111;--accent-ink:#ffffff;--accent-soft:#f1f1f1;--accent-line:#d6d6d6;--accent2:#111111;
  --com:#111111;--com-soft:#f1f1f1;--com-line:#d6d6d6;--pri:#111111;--hl:#f3f3f3;
  --bg:#f6f6f6;--surface:#ffffff;--sunk:#f7f7f7;--head:#f0f0f0;--ink:#111111;--ink2:#333333;--muted:#737373;--faint:#a3a3a3;
  --line:#e7e7e7;--line-strong:#d4d4d4;--th:#fafafa;--rowh:#f8f8f8;
  --sh-card:0 1px 2px rgba(0,0,0,.04),inset 0 0 0 1px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --accent:#f5f5f5;--accent-ink:#111;--accent-soft:#222;--accent-line:#3a3a3a;--accent2:#f5f5f5;
  --com:#f5f5f5;--com-soft:#222;--com-line:#3a3a3a;--pri:#f5f5f5;--hl:#1e1e1e;
  --bg:#0c0c0c;--surface:#151515;--sunk:#1a1a1a;--head:#202020;--ink:#f5f5f5;--ink2:#d4d4d4;--muted:#9a9a9a;--faint:#666;
  --line:#262626;--line-strong:#363636;--th:#181818;--rowh:#1b1b1b;
  --sh-card:inset 0 0 0 1px rgba(255,255,255,.07)}}
:root[data-theme="dark"]{
  --accent:#f5f5f5;--accent-ink:#111;--accent-soft:#222;--accent-line:#3a3a3a;--accent2:#f5f5f5;
  --com:#f5f5f5;--com-soft:#222;--com-line:#3a3a3a;--pri:#f5f5f5;--hl:#1e1e1e;
  --bg:#0c0c0c;--surface:#151515;--sunk:#1a1a1a;--head:#202020;--ink:#f5f5f5;--ink2:#d4d4d4;--muted:#9a9a9a;--faint:#666;
  --line:#262626;--line-strong:#363636;--th:#181818;--rowh:#1b1b1b;
  --sh-card:inset 0 0 0 1px rgba(255,255,255,.07)}
body{background:var(--bg)!important}
.top .logo .mk{color:var(--surface)!important;background:var(--ink)!important;box-shadow:none!important;border-radius:9px!important}
/* 조 표시는 원래 색 유지 */
.gb[class*="g-"].on{color:#fff}
.ev.dot::before{background:var(--ink)}
*{--glow:none}
.btn.primary{background:var(--ink)!important;border-color:var(--ink)!important;color:var(--surface)!important;box-shadow:none!important}

/* --- 월 선택 드롭다운 --- */
#msw{position:relative}
.mbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;border:0;background:none;color:var(--ink);font:inherit;font-size:14.5px;font-weight:800;letter-spacing:-.03em;cursor:pointer;border-radius:8px;white-space:nowrap}
.mbtn:hover{background:var(--head)}
.mbtn .i{width:15px;height:15px;color:var(--muted);transition:transform .15s}
.mbtn[aria-expanded="true"] .i{transform:rotate(180deg)}
.mmenu{position:absolute;top:calc(100% + 8px);left:0;min-width:240px;max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.12);padding:6px;z-index:80}
.mmenu[hidden]{display:none}
.mmenu button{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--ink);font:inherit}
.mmenu button b{font-size:14px;font-weight:700;letter-spacing:-.02em}
.mmenu button small{grid-column:1;font-size:12px;color:var(--muted);margin-top:1px}
.mmenu button .i{grid-row:1/3;grid-column:2;width:16px;height:16px}
.mmenu button:hover{background:var(--head)}
.mmenu button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.mmenu button[aria-selected="true"] small{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.mm-empty{padding:12px;color:var(--muted);font-size:13px}

/* --- 빠른 입력(붓) --- */
.brushbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;margin:0 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.brushbar.on{background:var(--surface);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.brushbar .bb-l{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--ink);margin-right:4px}
.brushbar .bb-l .i{width:15px;height:15px}
.brushbar .gb .i{width:13px;height:13px}
.brushbar .bb-h{flex:1 1 220px;font-size:12.5px;color:var(--muted);margin-left:6px}
.brushbar .bb-h b{color:var(--ink)}

/* ================= text helpers ================= */
function hi(s,q){s=esc(s);if(!q)return s;const qq=esc(q);const i=s.toLowerCase().indexOf(qq.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+qq.length)+'</mark>'+s.slice(i+qq.length)}
function person(v,q){const m=/^([가-힣A-Za-z]{2,4})(\d{1,2})$/.exec(String(v).trim());return m?`${hi(m[1],q)}<span class="cnt">${m[2]}</span>`:hi(v,q)}
function inline(s,q){let h=hi(s,q);h=h.replace(/^(\[[^\]]+\])/,'<span class="tag">$1</span>');h=h.replace(/^([^:<\[]{1,14}?)\s?:\s/,'<span class="tag">$1</span> : ');return h}
function fmt(t,q){
  let lines=String(t||'').split('\n');
  if(lines.length===1&&lines[0].length>90&&lines[0].includes(' / ')){const parts=lines[0].split(' / ').map(s=>s.trim()).filter(Boolean);if(parts.length>1)lines=parts.map(p=>'- '+p)}
  let out='',ul=false;const close=()=>{if(ul){out+='</ul>';ul=false}};
  for(const raw of lines){const l=raw.trim();let m;
    if(!l){close();continue}
    if((m=/^[-•·]\s*(.*)$/.exec(l))&&!/^-{2,}/.test(l)&&!/^->/.test(l)){if(!ul){out+='<ul>';ul=true}out+=`<li>${inline(m[1],q)}</li>`;continue}
    close();
    if(/^\*\*\s*/.test(l)){out+=`<div class="h">${inline(l.replace(/^\*\*\s*/,''),q)}</div>`;continue}
    if(/^[※*<⚠(]|^->/.test(l)){out+=`<div class="ref">${inline(l.replace(/^\*\s*/,''),q)}</div>`;continue}
    if((m=/^(\d{1,2}[\.\)])\s+(.*)$/.exec(l))){out+=`<div class="num-line"><b>${esc(m[1])}</b><span>${inline(m[2],q)}</span></div>`;continue}
    out+=`<p>${inline(l,q)}</p>`}
  close();return `<div class="fmt">${out}</div>`;
}
function eduItems(v){return String(v||'').split('\n').reduce((acc,l)=>{const m=/^\[([^\]]+)\]\s*(.*)$/.exec(l);
  if(m)acc.push({cat:m[1],t:m[2],m:''});else if(acc.length&&!acc[acc.length-1].m&&/·|\d{1,2}:\d{2}/.test(l))acc[acc.length-1].m=l;else if(l.trim())acc.push({cat:'',t:l,m:''});return acc},[])}
const eduText=items=>items.map(e=>(e.cat?`[${e.cat}] `:'')+e.t+(e.m?'\n'+e.m:'')).join('\n');
function opsLines(v){return String(v||'').split('\n').map(l=>{const m=/^(\d{2}:\d{2}|휴무)\s+(.*)$/.exec(l);return m?[m[1],m[2]]:['',l]})}

function blk(id){return S.doc?.blocks.find(b=>b.id===id&&!isCommonTab(b.tab))||S.com?.blocks.find(b=>b.id===id)||null}
function blocksOf(tab,sec){const src=isCommonTab(tab)?S.com?.blocks||[]:S.doc?.blocks||[];return src.filter(b=>b.tab===tab&&(sec==null||b.sec===sec))}
function listOf(b){return isCommonTab(b.tab)?S.com.blocks:S.doc.blocks}
function periodDays(){const p=S.doc.period||{};let a=p.start,z=p.end;const all=LAYERS.flatMap(k=>Object.keys(S.doc.cal?.[k]||{})).sort();if(!a)a=all[0]||todayIso();if(!z)z=all[all.length-1]||a;return [a,z]}
function normalizeMonth(doc){
  doc.cal=doc.cal||{};LAYERS.forEach(k=>doc.cal[k]=doc.cal[k]||{});doc.blocks=doc.blocks||[];
  doc.blocks.forEach(b=>{if(TAB_FIX[b.id]&&!isCommonTab(b.tab))b.tab=TAB_FIX[b.id];if(b.sec==null)b.sec=SEC_DEFAULT[b.id]||''});
  doc.rosters=doc.rosters||{};
  for(const k of Object.keys(GK)){
    if(!Array.isArray(doc.rosters[k])||!doc.rosters[k].length){const b=doc.blocks.find(x=>x.id===GK[k].gb);const groups={};
      GROUPS.forEach(g=>{const r=b?.rows.find(r=>groupOf(r[0])===g);groups[g]=r?String(r[1]).split(/\s+/).filter(Boolean):[]});
      doc.rosters[k]=[{from:doc.period?.start||'',groups}]}
    doc.cal[GK[k].mem]=doc.cal[GK[k].mem]||{};
  }
}
function normalizeCommon(c){c.blocks=c.blocks||[];c.blocks.forEach(b=>{if(b.sec==null)b.sec=SEC_DEFAULT[b.id]||''})}
const versions=k=>S.doc.rosters[k].map((v,i)=>[v,i]).sort((a,b)=>(a[0].from||'')<(b[0].from||'')?-1:1);
function rosterAt(k,date){let r=versions(k)[0][0];for(const [v] of versions(k))if(!v.from||v.from<=date)r=v;return r}
function effMembers(k,date){const ov=S.doc.cal[GK[k].mem]?.[date];const g=groupOf(S.doc.cal[k]?.[date]);const base=g?(rosterAt(k,date).groups[g]||[]):[];return Array.isArray(ov)?{list:ov,override:true,base}:{list:base,override:false,base}}
function allPeople(){const set=new Set();(S.com?.blocks||[]).filter(b=>b.kind==='dept').forEach(b=>b.rows.forEach(r=>r[2]&&set.add(r[2])));Object.keys(GK).forEach(k=>S.doc.rosters[k].forEach(v=>GROUPS.forEach(g=>(v.groups[g]||[]).forEach(n=>set.add(n)))));return [...set].sort((a,b)=>a.localeCompare(b,'ko'))}
const sameList=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);
function setOverride(k,date,list){const e=effMembers(k,date);const m=S.doc.cal[GK[k].mem];if(sameList(list,e.base))delete m[date];else m[date]=list}

function autoFill(k,opt){
  const cal=S.doc.cal,mem=cal[GK[k].mem],[a,z]=periodDays();
  const hol=x=>HOL.test(cal.memo?.[x]||'');
  const cnt={},wdc={};opt.groups.forEach(g=>{cnt[g]=0;wdc[g]=[0,0,0,0,0,0,0]});
  const dates=[];
  for(let x=a;x<=z;x=addDays(x,1)){const wd=parse(x).getDay();if(!opt.days.includes(wd))continue;if(opt.skipHol&&hol(x))continue;
    const g=groupOf(cal[k][x]);
    if(opt.mode==='empty'&&cal[k][x]){if(g&&cnt[g]!=null){cnt[g]++;wdc[g][wd]++}continue}
    dates.push(x)}
  const prevG=x=>{for(let i=1;i<=3;i++){const y=addDays(x,-i);if(opt.days.includes(parse(y).getDay()))return groupOf(cal[k][y])}return null};
  if(opt.mode==='all')dates.forEach(x=>{delete cal[k][x];delete mem[x]});
  for(const x of dates){const wd=parse(x).getDay(),pg=prevG(x);
    const best=opt.groups.map(g=>[cnt[g]*100+wdc[g][wd]*10+(g===pg?60:0)+Math.random()*5,g]).sort((p,q)=>p[0]-q[0])[0][1];
    cal[k][x]=best+'조';delete mem[x];cnt[best]++;wdc[best][wd]++}
  let wk=0;
  if(opt.weekend)for(let x=a;x<=z;x=addDays(x,1)){const wd=parse(x).getDay();if((wd===0||wd===6)&&!opt.days.includes(wd)&&(opt.mode==='all'||!cal[k][x])){cal[k][x]='지원';delete mem[x];wk++}}
  const vals=opt.groups.map(g=>cnt[g]);return {n:dates.length,min:Math.min(...vals),max:Math.max(...vals),wk};
}

const fmtAt=s=>{if(!s)return '';const d=new Date(s);if(isNaN(d))return String(s);return `${String(d.getFullYear()).slice(2)}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const AUTH_MSG={"auth/invalid-credential":"이메일 또는 비밀번호가 맞지 않습니다.","auth/invalid-login-credentials":"이메일 또는 비밀번호가 맞지 않습니다.","auth/wrong-password":"비밀번호가 맞지 않습니다.","auth/user-not-found":"가입되지 않은 이메일입니다. ‘가입 신청’에서 먼저 신청해 주세요.","auth/email-already-in-use":"이미 있는 계정입니다. 그 비밀번호로 로그인하면 이어서 신청할 수 있습니다.","auth/weak-password":"비밀번호는 6자 이상이어야 합니다.","auth/invalid-email":"이메일 형식이 맞지 않습니다.","auth/too-many-requests":"시도가 너무 많습니다. 잠시 뒤 다시 해 주세요.","auth/network-request-failed":"인터넷 연결을 확인해 주세요.","permission-denied":"저장 권한이 없습니다. 관리자에게 문의해 주세요."};
const authMsg=e=>AUTH_MSG[e?.code]||('처리하지 못했습니다. ('+(e?.code||e?.message||'오류')+')');

/* 기존 화면 코드가 쓰던 저장소 모양(collection/doc/onSnapshot/set/delete)을 Firestore 에 맞춰 줌 */
/* Firestore 는 '목록 안의 목록'을 저장하지 못해서, 저장할 때 감싸고 읽을 때 풉니다 */
const fsEnc=v=>Array.isArray(v)?v.map(x=>Array.isArray(x)?{__a:fsEnc(x)}:fsEnc(x)):(v&&typeof v==='object')?Object.fromEntries(Object.entries(v).filter(([,x])=>x!==undefined).map(([k,x])=>[k,fsEnc(x)])):v;
const fsDec=v=>Array.isArray(v)?v.map(fsDec):(v&&typeof v==='object')?((Object.keys(v).length===1&&'__a' in v)?fsDec(v.__a):Object.fromEntries(Object.entries(v).map(([k,x])=>[k,fsDec(x)]))):v;
function fsAdapter(fdb){
  const map=p=>{const a=p.split('/');a[0]=COL[a[0]]||a[0];return a.join('/')};
  const wrapDoc=s=>({id:s.id,exists:s.exists,data:()=>fsDec(s.data())});
  return {
    collection:n=>({onSnapshot:(cb,err)=>fdb.collection(map(n)).onSnapshot(s=>cb({docs:s.docs.map(wrapDoc)}),e=>err&&err({code:e.code}))}),
    doc:p=>{const r=fdb.doc(map(p));return {set:d=>r.set(fsEnc(d)),delete:()=>r.delete(),get:()=>r.get().then(wrapDoc),onSnapshot:(cb,err)=>r.onSnapshot(s=>cb(wrapDoc(s)),e=>err&&err({code:e.code}))}}
  };
}

function authStart(){
  if(!window.firebase){A.mode='nofb';render();return}
  if(!FB_CFG.apiKey||!FB_CFG.projectId||/여기/.test(FB_CFG.apiKey)){A.mode='nocfg';render();return}
  A.fb=firebase.apps.find(a=>a.name==='ops')||firebase.initializeApp(FB_CFG,'ops');
  A.auth=A.fb.auth();A.fdb=A.fb.firestore();try{A.fdb.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  A.auth.onAuthStateChanged(u=>{
    A.user=u;if(A.unsubMe){A.unsubMe();A.unsubMe=null}if(A.unsubU){A.unsubU();A.unsubU=null}
    if(!u){A.prof=null;A.mode=A.mode==='signup'?'signup':'login';S.db=null;render();return}
    A.mode='wait';render();
    A.unsubMe=A.fdb.collection('ops_users').doc(u.uid).onSnapshot(async s=>{
      A.prof=s.exists?s.data():null;
      if(isOwnerA()&&(!A.prof||A.prof.status!=='approved'||A.prof.role!=='edit')){
        try{await A.fdb.collection('ops_users').doc(u.uid).set({...(A.prof||{}),uid:u.uid,email:(u.email||'').toLowerCase(),name:A.prof?.name||'김태욱',dept:A.prof?.dept||'사업부 3부서',status:'approved',role:'edit',owner:true,createdAt:A.prof?.createdAt||new Date().toISOString(),decidedAt:new Date().toISOString()})}catch(e){}
      }
      if(approved()){A.mode='in';if(!CAN())S.edit=false;startData();if(isOwnerA()&&!A.unsubU)watchUsers()}
      else A.mode=A.prof?(A.prof.status==='rejected'?'rejected':A.prof.status==='removed'?'removed':'pending'):'apply';
      renderChrome();render();
    },e=>{A.mode='apply';A.err=authMsg(e);render()});
  });
}
function watchUsers(){
  A.unsubU=A.fdb.collection('ops_users').onSnapshot(s=>{A.users={};s.docs.forEach(d=>A.users[d.id]=d.data());renderChrome();if(S.tab==='members'){S.keepScroll=true;render()}},()=>{});
}

async function doSignup(){

async function doImport(){
  const f=A.impFile;if(!f){toast('파일을 먼저 고르세요');return}
  try{const j=JSON.parse(await f.text());const ms=j.months||{};let n=0;
    for(const [id,d] of Object.entries(ms)){await A.fdb.collection(COL.months).doc(id).set(fsEnc(d));n++}
    /* 고정 내용은 따로 한 벌 저장 (파일에 따로 없으면 달 자료 안의 규정·수강료·조직도·업무분장을 꺼내서) */
    let com=j.common;if(!com){const src=Object.values(ms).slice(-1)[0];const bl=(src?.blocks||[]).filter(b=>COMMON_TABS.has(TAB_FIX[b.id]||b.tab));if(bl.length)com={blocks:clone(bl),label:'내용',updatedAt:new Date().toISOString().slice(0,19),revs:[]}}
    if(com)await A.fdb.collection(COL.common).doc('main').set(fsEnc(com));

}

/* ---------- 운영표 자료 구독 (승인된 뒤에만) ---------- */
function startData(){
  if(A.started)return;A.started=true;
  const db=fsAdapter(A.fdb);S.db=db;
  let gotM=false,gotC=false,booted=false;
  const boot=()=>{if(booted||!gotM||!gotC)return;booted=true;const want=ls.get('month');const ids=Object.keys(S.months).sort();pickDoc(S.months[want]?want:(ids[ids.length-1]||null));render()};
  setTimeout(()=>{if(!gotC){gotC=true;boot()}},4000);
  db.collection('common').onSnapshot(snap=>{
    const d=snap.docs.find(x=>x.id==='main'&&x.exists);const next=d?d.data():null;const prev=S.common;S.common=next;gotC=true;
    if(!booted)return boot();
    if(JSON.stringify(next)!==JSON.stringify(prev)){if(S.dirtyC){if(next&&next.updatedAt!==S.com?.updatedAt){S.remoteNewer=true;render()}}else{pickCommon();S.keepScroll=true;render()}}
  },err=>{gotC=true;S.msg={text:'내용을 불러오지 못했습니다. ('+(err?.code||'오류')+')'};boot();render()});
  db.collection('months').onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{if(d.exists)next[d.id]=d.data()});
    const prevDoc=S.id?S.months[S.id]:null;S.months=next;gotM=true;
    if(!booted)return boot();
    if(!S.id||!next[S.id]){const ids=Object.keys(next).sort();pickDoc(ids[ids.length-1]||null);render()}
    else if(JSON.stringify(next[S.id])!==JSON.stringify(prevDoc)){if(S.dirtyM){if(next[S.id].updatedAt!==S.doc.updatedAt){S.remoteNewer=true;render()}}else{pickDoc(S.id);S.keepScroll=true;render()}}
    else renderChrome();
  },err=>{S.msg={text:'운영표를 불러오지 못했습니다. 페이지를 새로 고쳐 주세요. ('+(err?.code||'오류')+')'};render()});
}

function rosterEditor(k){

  const vi=S.rv[k],cur=S.doc.rosters[k][vi];
  const roster=`<div class="vtabs">${vs.map(([v,i])=>`<button type="button" class="btn sm ${i===vi?'on':''}" data-rv="${k}|${i}">${v.from?`${md(v.from)}부터`:'처음부터'}</button>`).join('')}
     <span class="addp"><input type="date" id="rvDate" value="${sel}" aria-label="새 편성 시작일"><button type="button" class="btn sm" data-rvnew="${k}">이 날부터 새 편성</button></span>
     ${vs.length>1?`<button type="button" class="btn sm danger" data-rvdel="${k}|${vi}">이 편성 삭제</button>`:''}</div>
    <div class="tw"><table class="roster"><tbody>${GROUPS.map(g=>`<tr><th><span class="chip g-${g}">${g}조</span><small>${(cur.groups[g]||[]).length}명</small></th><td data-drop="rgrp|${k}|${vi}|${g}"><div class="ed-v">${(cur.groups[g]||[]).map(n=>`<span class="pchip" data-drag="rmem|${k}|${vi}|${g}|${esc(n)}">${esc(n)}<button type="button" class="px" aria-label="${esc(n)} 빼기" data-grem="${k}|${vi}|${g}|${esc(n)}">${icx('x')}</button></span>`).join('')}
      <span class="addp"><input type="text" id="gadd-${g}" list="peopleList" placeholder="이름"><button type="button" class="btn sm" data-gadd="${k}|${vi}|${g}">추가</button></span></div></td></tr>`).join('')}</tbody></table></div>`;
  return peopleList()+card('roster','조 편성','사람을 다른 조로 끌어 옮길 수 있습니다. 조에서 넣고 빼면 그 편성 기간의 모든 날짜에 반영됩니다. 중간에 인원이 바뀌면 ‘이 날부터 새 편성’으로 나누세요.',roster);
}
function rosterCount(k){
  const cfg=GK[k],cal=S.doc.cal,[a,z]=periodDays(),days=cfg.days;
  const t={};GROUPS.forEach(g=>t[g]=[0,0,0,0,0,0,0]);const per={};
  for(let x=a;x<=z;x=addDays(x,1)){const g=groupOf(cal[k]?.[x]);if(g)t[g][parse(x).getDay()]++;effMembers(k,x).list.forEach(n=>(per[n]=per[n]||[]).push(x))}
  const cnt=`<div class="tw"><table><thead><tr><th>조</th>${days.map(i=>`<th class="num">${WD[i]}</th>`).join('')}<th class="num">합계</th></tr></thead><tbody>${GROUPS.map(g=>`<tr><td><span class="chip g-${g}">${g}조</span></td>${days.map(i=>`<td class="num">${t[g][i]||'·'}</td>`).join('')}<td class="num calc">${days.reduce((s,i)=>s+t[g][i],0)}</td></tr>`).join('')}</tbody></table></div>`;
  const ppl=Object.entries(per).sort((x,y)=>y[1].length-x[1].length||x[0].localeCompare(y[0],'ko'));
  const pcnt=`<div class="tw"><table class="stk"><thead><tr><th>이름</th><th class="num">횟수</th><th>날짜</th></tr></thead><tbody>${ppl.map(([n,ds])=>`<tr><td class="nw" data-l="이름">${esc(n)}</td><td class="num" data-l="횟수">${ds.length}</td><td data-l="날짜">${ds.map(md).join(', ')}</td></tr>`).join('')||'<tr><td colspan="3" class="empty-cell">아직 배정된 사람이 없습니다.</td></tr>'}</tbody></table></div>`;
  return `<div class="grid2">${card('rcount','조별 횟수','달력에서 자동 집계',cnt)}${card('rpeople','사람별 횟수','날짜별로 바꾼 인원까지 반영',pcnt)}</div>`;
}
function viewRoster(k){
  const sub=curSub(k);let body='';
  if(sub==='cal')body=rosterCal(k)+rosterSetup(k);
  else if(sub==='roster')body=rosterEditor(k);
  else if(sub==='count')body=rosterCount(k);
  else if(sub==='order')body=editHint()+(flow(blocksOf('assign','order'))||'<div class="empty-state">배정 순번표가 없습니다.</div>')+addBlockBar('assign','order');
  else if(sub==='rule'){const r=blk(GK[k].rule);body=comBar()+editHint()+(r?flow([r],'one'):'<div class="empty-state">규정이 없습니다.</div>')}
  return pageHead(k,PAGES[k].label)+body;
}

/* ================= render ================= */
function render(){
  renderChrome();renderNav();
  const page=$('#page');let top='';
  if(S.msg)top+=`<div class="banner ${S.msg.info?'info':''}">${esc(S.msg.text)}</div>`;
  if(S.remoteNewer&&S.dirty)top+=`<div class="banner">다른 사람이 먼저 저장했습니다. 지금 저장하면 그 내용을 덮어씁니다. ‘변경 취소’를 누르면 최신 내용을 불러옵니다.</div>`;
  top+=panelHtml();
  page.className=(S.edit?'editing ':'')+(isCommonTab(S.tab)?'c-page':'');
  document.body.classList.toggle('locked',A.mode!=='in');
  if(A.mode!=='in'){page.innerHTML=authHtml();return}
  if(S.tab==='members'){page.innerHTML=viewMembers().replace('%%TOP%%',top)+'</main>';return}
  if(!S.db){page.innerHTML=`<main class="wrap">${top}<div class="empty-state" style="margin-top:40px">저장소에 연결하지 못해 운영표를 열 수 없습니다. 로그인한 상태로 이 페이지를 다시 열어 주세요.</div></main>`;return}
  if(!S.doc){page.innerHTML=`<main class="wrap">${top}${emptyHtml()}</main>`;return}
  const v={today:viewToday,duty:()=>viewRoster('duty'),assign:()=>viewRoster('assign'),edu:viewEdu,ops:viewOps,sales:()=>secPage('sales'),tuition:viewTuition,rules:viewRules,org:()=>secPage('org'),lead:()=>secPage('lead')}[S.tab];
  const foot=`<div class="foot">원본 ${esc(S.doc.source||'-')} · 이번 달 저장 ${esc(String(S.doc.updatedAt||'').replace('T',' ').slice(0,16))}${S.com?.updatedAt?` · 내용 수정 ${esc(String(S.com.updatedAt).replace('T',' ').slice(0,16))}`:''}</div>`;
  const y=scrollY;page.innerHTML=v().replace('%%TOP%%',top+revPanel())+foot+'</main>'+popHtml()+randHtml()+revAskHtml()+renHtml();
  if(S.keepScroll){scrollTo(0,y);S.keepScroll=false}
  placePop();buildToc();
}
function buildToc(){
  if(['today','duty','assign','edu','ops'].includes(S.tab))return;
  const cards=[...document.querySelectorAll('#page main .card[id^="b-"]')].filter(c=>c.querySelector('h2'));
  if(cards.length<3)return;
  const nav=document.createElement('nav');nav.className='toc';nav.setAttribute('aria-label','이 화면 바로가기');
  nav.innerHTML='<span>바로가기</span>'+cards.map(c=>`<button type="button" data-jump="${c.id}">${esc(c.querySelector('h2').textContent.trim())}</button>`).join('');
  const first=cards[0],host=first.closest('.flow')||first;host.parentNode.insertBefore(nav,host);
}

/* ================= load / save ================= */
function commonFrom(monthDoc){const c={blocks:clone((monthDoc?.blocks||[]).filter(b=>isCommonTab(b.tab))),label:'내용',updatedAt:''};normalizeCommon(c);return c}
function pickCommon(){S.com=S.common?clone(S.common):commonFrom(S.doc);normalizeCommon(S.com);S.savedC=JSON.stringify(S.com);S.dirtyC=false}
function pickDoc(id){
  S.id=id;S.doc=S.months[id]?clone(S.months[id]):null;S.remoteNewer=false;S.hist=[];S.fut=[];S.confirm=null;
  if(S.doc){normalizeMonth(S.doc);const [a,z]=periodDays();const t=todayIso();if(!S.date||S.date<addDays(a,-7)||S.date>addDays(z,7))S.date=(t>=a&&t<=z)?t:a}
  S.savedM=S.doc?JSON.stringify(S.doc):'';S.dirtyM=false;
  if(!S.com||!S.dirtyC)pickCommon();
  S.dirty=S.dirtyM||S.dirtyC;
  ls.set('month',id||'');
}
async function save(){
  if(!S.db||!S.dirty||!CAN())return;
  if(S.dirtyC&&!S.revOk){S.revAsk=true;render();return}
  const btn=$('#saveBtn');btn.disabled=true;btn.textContent='저장 중…';
  const now=new Date().toISOString().slice(0,19);
  try{
    /* 고정 내용을 먼저 따로 저장해 둔 뒤에야 달 자료에서 뺀다 (순서가 바뀌면 내용이 사라짐) */
    const needC=S.dirtyC||(!S.common&&(S.com?.blocks||[]).length>0);
    if(needC){if(S.dirtyC){const r=S.revOk;S.com.revs=(S.com.revs||[]).concat([{date:r.date,at:now,by:r.by||'',pages:changedPages(),note:r.note||''}]).slice(-200)}
      const out=clone(S.com);out.updatedAt=S.dirtyC?now:(out.updatedAt||now);await S.db.doc('common/main').set(out);S.com.updatedAt=out.updatedAt;S.common=clone(out);S.savedC=JSON.stringify(S.com)}
    if(S.dirtyM){const keepCommon=!S.common;const out=clone(S.doc);out.updatedAt=now;if(!keepCommon)out.blocks=out.blocks.filter(b=>!isCommonTab(b.tab));out.schema=2;await S.db.doc('months/'+S.id).set(out);S.doc.updatedAt=now;S.months[S.id]=clone(out);S.savedM=JSON.stringify(S.doc)}
    S.revOk=null;S.remoteNewer=false;S.msg=null;changed();toast('저장했습니다');
  }catch(e){S.revOk=null;S.msg={text:e?.code==='quota_exceeded'?'저장 공간이 가득 찼습니다. 오래된 달을 삭제한 뒤 다시 저장하세요.':'저장하지 못했습니다. 편집 권한이 있는지 확인하고 다시 눌러 주세요. ('+(e?.code||'오류')+')'};changed()}
  btn.disabled=false;btn.textContent='저장';S.keepScroll=true;render();
}
async function createMonth(){
  const id=$('#nmId').value,label=$('#nmLabel').value.trim(),start=$('#nmStart').value,end=$('#nmEnd').value;
  if(!/^\d{4}-\d{2}$/.test(id)){S.msg={text:'월을 선택하세요.'};return render()}
  if(S.months[id]){S.msg={text:'이미 같은 달이 있습니다. 위의 월 선택에서 여세요.'};return render()}
  if(start&&end&&start>end){S.msg={text:'영업 종료일이 시작일보다 앞섭니다.'};return render()}
  const blocks=S.doc?clone(S.doc.blocks.filter(b=>!isCommonTab(b.tab)&&b.tab!=='legacy')):[];
  blocks.forEach(b=>{if(b.type!=='table')return;if(b.reset==='clear')b.rows=[];if(b.reset==='counts')b.rows=b.rows.map(r=>[r[0],'',''])});
  const y=Number(id.slice(0,4)),m=Number(id.slice(5));const nstart=start||`${id}-01`;
  const rosters={};if(S.doc?.rosters)Object.keys(GK).forEach(k=>{const vs=versions(k);rosters[k]=[{from:nstart,groups:clone(vs[vs.length-1][0].groups)}]});
  const doc={schema:2,rosters,label:label||`${y}년 ${m}월 영업`,period:{start:nstart,end:end||iso(new Date(y,m,0))},cal:{duty:{},assign:{},edu:{},ops:{},memo:{},dutyMembers:{},assignMembers:{}},blocks,source:S.doc?`${S.doc.label}에서 복사`:'새로 작성',updatedAt:new Date().toISOString().slice(0,19)};
  try{await S.db.doc('months/'+id).set(doc);S.months[id]=doc;pickDoc(id);S.panel=null;S.tab='duty';S.msg=null;toast(`‘${doc.label}’를 만들었습니다`)}
  catch(e){S.msg={text:'만들지 못했습니다. 편집 권한을 확인하세요. ('+(e?.code||'오류')+')'}}
  render();
}
function switchMonth(id){if(!id||id===S.id)return;if(S.dirtyM){toast('이번 달에 저장하지 않은 변경이 있습니다. 저장하거나 취소한 뒤 옮기세요.');renderChrome();return}pickDoc(id);S.msg=null;render()}

/* ================= actions ================= */
function act(t){
  const d=t.dataset;
  if(d.month){$('#mMenu').hidden=true;$('#mBtn').setAttribute('aria-expanded','false');switchMonth(d.month);return true}
  if(d.brush!=null){const [k,v]=sp(d.brush);if(S.brush&&S.brush.k===k&&S.brush.v===v)S.brush=null;else{S.brush={k,v};S.edit=true;S.pop=null}S.keepScroll=true;render();return true}
  if(d.brushoff){S.brush=null;S.keepScroll=true;render();return true}
  if(d.cview){const [k,v]=sp(d.cview);S.cview=S.cview||{};S.cview[k]=v;S.pop=null;S.keepScroll=true;render();return true}
  if(d.renx){S.renAsk=false;S.keepScroll=true;render();return true}
  if(d.rengo){const lb=$('#renLabel').value.trim(),a=$('#renStart').value,z=$('#renEnd').value;if(!lb){toast('이름을 적어 주세요');return true}if(!a||!z||a>z){toast('시작일과 종료일을 확인해 주세요');return true}
    S.renAsk=false;mutate(()=>{S.doc.label=lb;S.doc.period={start:a,end:z}});save();return true}
  if(d.revs){S.showRevs=!S.showRevs;S.keepScroll=true;render();return true}
  if(d.revx){S.revAsk=false;S.keepScroll=true;render();return true}
  if(d.revgo){const dt=$('#revDate').value;if(!dt){toast('수정 날짜를 골라 주세요');return true}S.revOk={date:dt,note:$('#revNote').value.trim(),by:(typeof A!=='undefined'&&A.prof?.name)||''};S.revAsk=false;save();return true}
  if(d.jump){const el=document.getElementById(d.jump);if(el){const y=el.getBoundingClientRect().top+scrollY-(document.querySelector('.top2').offsetHeight+12);scrollTo({top:y,behavior:'smooth'})}return true}
  if(d.cm){const ms=calMonths();if(d.cm==='0'){const t0=todayIso().slice(0,7);S.cm=ms.includes(t0)?t0:ms[0]}else{const i=ms.indexOf(calMonth())+Number(d.cm);if(ms[i])S.cm=ms[i]}S.pop=null;S.keepScroll=true;render();return true}
  if(d.pop){const [key,x]=sp(d.pop);const inPop=!!t.closest('#pop');if(!inPop&&S.pop&&S.pop.key===key&&S.pop.date===x)S.pop=null;else{S.pop={key,date:x};if(GK[key])S.rsel[key]=x;else S.csel[key]=x;if(inPop&&calMonths().includes(x.slice(0,7)))S.cm=x.slice(0,7)}S.keepScroll=true;render();return true}
  if(d.popx){S.pop=null;S.keepScroll=true;render();return true}
  if(d.amode){A.mode=d.amode;A.err='';render();return true}
  if(d.logout){A.auth&&A.auth.signOut().then(()=>location.reload());return true}
  if(d.reapply){A.mode='reapply';A.err='';render();return true}
  if(d.approve){const [id,r]=sp(d.approve);updUser(id,{status:'approved',role:r},`${ROLE_L[r]} 권한으로 승인했습니다`);return true}
  if(d.reject){updUser(d.reject,{status:'rejected'},'반려했습니다');return true}
  if(d.role){const [id,r]=sp(d.role);updUser(id,{role:r},`${ROLE_L[r]} 권한으로 바꿨습니다`);return true}
  if(d.kick){S.confirm='mem:'+d.kick;S.keepScroll=true;render();return true}
  if(d.kickgo){const id=d.kickgo;S.confirm=null;updUser(id,{status:'removed',role:'view'},'이용을 중지했습니다');return true}

function canDrop(src,dst){

  if(dt==='rday')return ['grp','day','per','dmem','rmem'].includes(st)&&(st==='per'||src[1]===dst[1])&&!(st==='day'&&src[2]===dst[2]);
  if(dt==='rgrp')return ['per','dmem','rmem'].includes(st)&&(st==='per'||src[1]===dst[1]);
  if(dt==='row'||dt==='rowend'){if(st!=='row')return false;const a=blk(src[1]),b=blk(dst[1]);return !!a&&!!b&&(a===b||(a.cols.length===b.cols.length&&a.kind===b.kind))}
  if(dt==='item'||dt==='itemend')return st==='item';

  if(dt==='seat')return st==='seat'&&src[1]===dst[1]&&!(src[2]===dst[2]&&src[3]===dst[3]);
  if(dt==='cday')return st==='cal'&&(src[1]===dst[1]||src[1]==='memo')&&src[2]!==dst[2];
  return false;
}

    if(st==='day'){const [,k,x]=src;mutate(()=>{delete cal[k][x];delete cal[GK[k].mem][x]},`${md(x)} 비움`)}

    if(st==='grp'){S.rsel[k]=x;mutate(()=>{setCal(k,x,src[2]);delete cal[GK[k].mem][x]},`${md(x)} → ${src[2]}`);return}
    if(st==='day'){const y=src[2];mutate(()=>{const m=cal[GK[k].mem];const [v1,v2,o1,o2]=[cal[k][y],cal[k][x],m[y],m[x]];v2!=null?cal[k][y]=v2:delete cal[k][y];v1!=null?cal[k][x]=v1:delete cal[k][x];o2?m[y]=o2:delete m[y];o1?m[x]=o1:delete m[x]},`${md(y)} ↔ ${md(x)} 바꿈`);return}
    const n=st==='per'?src[1]:st==='dmem'?src[3]:src[4];S.rsel[k]=x;
    mutate(()=>{const l=effMembers(k,x).list;if(!l.includes(n))setOverride(k,x,[...l,n]);if(st==='dmem'&&src[2]!==x){const y=src[2];setOverride(k,y,effMembers(k,y).list.filter(z=>z!==n))}},st==='dmem'?`${n}: ${md(src[2])} → ${md(x)}`:`${md(x)}에 ${n} 추가`);return}

    mutate(()=>{const gr=S.doc.rosters[k][+i].groups;if(st==='rmem'&&+src[2]===+i){const og=src[3];gr[og]=gr[og].filter(y=>y!==n)}gr[g]=gr[g]||[];if(!gr[g].includes(n))gr[g].push(n)},st==='rmem'?`${n} → ${g}조`:`${g}조에 ${n} 추가`);return}

    mutate(()=>{const [it]=a.items.splice(ai,1);let j=dt==='itemend'?b.items.length:+dst[2];if(a===b&&ai<j)j--;if(dt==='item'&&pos==='after')j++;b.items.splice(j,0,it)},'항목을 옮겼습니다');return}

  if(dt==='seat'){const b=blk(src[1]);const [r1,c1,r2,c2]=[+src[2],+src[3],+dst[2],+dst[3]];mutate(()=>{const v=b.rows[r1][c1];b.rows[r1][c1]=b.rows[r2][c2];b.rows[r2][c2]=v},'자리를 바꿨습니다');return}

    return}
}

  if(S.pop&&GK[S.pop.key]&&CAN()&&!inField&&!mod){const k=S.pop.key,x=S.pop.date;const key=e.key.toUpperCase();const gi='12345'.indexOf(e.key);const G=GROUPS.includes(key)?key:gi>=0?GROUPS[gi]:null;
    if(G){e.preventDefault();S.edit=true;mutate(()=>{setCal(k,x,G+'조');delete S.doc.cal[GK[k].mem][x]});const n=stepDay(k,x,1);if(n)S.pop={key:k,date:n};S.keepScroll=true;render();return}
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();mutate(()=>{setCal(k,x,'');delete S.doc.cal[GK[k].mem][x]});return}
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const n=stepDay(k,x,e.key==='ArrowRight'?1:-1);if(n){S.pop={key:k,date:n};S.keepScroll=true;render()}return}}
  if(e.key==='Escape'&&(S.pop||S.rand||S.renAsk)){S.pop=null;S.rand=null;S.renAsk=false;S.keepScroll=true;render();return}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();save();return}
  if(mod&&!inField&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&!inField&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.cell,.ag,.mc-c,[data-rsel],[data-csel]')&&!inField){e.preventDefault();e.target.click();return}
  if(e.key==='Enter'&&e.target.matches?.('#radd,#rtxt,[id^=gadd-]')){e.preventDefault();e.target.parentElement.querySelector('button')?.click()}
});
document.addEventListener('focusin',e=>{if(e.target.matches?.('[data-p],[data-cal]'))S.pend=snap()});
let IME=false;
document.addEventListener('compositionstart',()=>{IME=true});
document.addEventListener('compositionend',e=>{IME=false;onInput(e.target)});
document.addEventListener('input',e=>{IME=IME&&e.isComposing!==false;onInput(e.target)});
function onInput(t){
  if(!t||!t.dataset)return;
  if(t.dataset.p||t.dataset.cal){if(S.pend){pushHist(S.pend);S.pend=null}
    if(t.dataset.p)setPath(t.dataset.p,t.innerText.replace(/\n$/,''));else setCal(t.dataset.cal,t.dataset.d,t.value);changed();
    if(t.dataset.cal){clearTimeout(S.calT);S.calT=setTimeout(()=>{const k=t.dataset.cal,a=t.selectionStart,z=t.selectionEnd;if(IME||document.activeElement!==t)return;S.keepScroll=true;render();const n=document.querySelector(`textarea[data-cal="${k}"]`);if(n){n.focus();n.setSelectionRange(a,z)}},700)}
    return}
  if(t.id==='tq'||t.id==='rq'){S[t.id]=t.value;if(IME)return;const pos=t.selectionStart;S.keepScroll=true;render();const n=$('#'+t.id);if(n){n.focus();n.setSelectionRange(pos,pos)}}
}
document.addEventListener('submit',e=>{const id=e.target.id;if(id==='loginForm'){e.preventDefault();doLogin()}if(id==='signupForm'){e.preventDefault();doSignup()}if(id==='applyForm'){e.preventDefault();doApply()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='perStart'||t.id==='perEnd'){const a=$('#perStart').value,z=$('#perEnd').value;if(!a||!z)return;if(a>z){toast('종료일이 시작일보다 앞설 수 없습니다');render();return}mutate(()=>{S.doc.period={start:a,end:z}},`영업기간을 ${md(a)} ~ ${md(z)}로 바꿨습니다`);return}
  if(t.id==='monthSel')switchMonth(t.value);
  if(t.id==='impFile'){A.impFile=t.files[0]||null;S.keepScroll=true;render()}
  if(t.id==='datePick'&&t.value){S.date=t.value;render()}
  if(t.id==='showNames'){S.showNames=t.checked;S.keepScroll=true;render()}
  if(t.id==='tdept'){S.tdept=t.value;S.keepScroll=true;render()}
  if(t.id==='calcDate'&&t.value){S.calcDate=t.value;S.keepScroll=true;render()}
});
document.addEventListener('toggle',e=>{if(e.target.id==='moreDet')S.openMore=e.target.open},true);
window.addEventListener('resize',()=>placePop());
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});

/* ================= boot ================= */
A.mode='boot';render();authStart();
})();
</script>

</body>
</html>
