/* ===== 로그인 · 가입 · 회원 관리 ===== */
body.locked .top2,body.locked #msw,body.locked .dchip,body.locked #editBtn,body.locked .menu-wrap{display:none!important}
.gate{display:grid;place-items:center;min-height:calc(100vh - 60px);padding-block:40px}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);padding:34px 32px 30px}
.gate-mk{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(140deg,#5873ff,#2c46c8);color:#fff;font-weight:800;font-size:11px;letter-spacing:.04em;margin-bottom:18px}
.gate-card h1{margin:0 0 8px;font-size:21px;font-weight:700;letter-spacing:-.045em}
.gate-card p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.65}
.gate-tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px}
.gate-tabs button{flex:1;border:0;background:none;border-radius:8px;padding:8px 0;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.gate-tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}
.gate-f{display:flex;flex-direction:column;gap:14px}
.gate-f label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.gate-f select,.gate-f input{width:100%;min-height:42px;font-size:14.5px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 12px}
.gate-f .btn{min-height:44px;margin-top:4px;font-size:14.5px}
.gate-err{margin:0!important;color:var(--warn)!important;font-size:13px!important}
.gate-dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0 0 22px;padding:16px 18px;background:var(--sunk);border-radius:10px;font-size:14px}
.gate-dl dt{color:var(--muted);font-weight:600}.gate-dl dd{margin:0;font-weight:600;word-break:break-all}
.gate-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gate .lnk{margin-top:14px}
.membtn{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#e6ebf5;border-radius:999px;padding:5px 12px 5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:32px}
.membtn svg.i{width:16px;height:16px}
.membtn:hover,.membtn[aria-current=true]{background:rgba(124,150,255,.2);border-color:#8aa2ff;color:#fff}
.membtn .bd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#f04438;color:#fff;font-size:11px;font-weight:700}
.mechip{display:inline-flex;align-items:center;gap:8px;color:#c3cbdb;font-size:12.5px;font-weight:600;padding-left:6px;border-left:1px solid rgba(255,255,255,.12);margin-left:2px;white-space:nowrap}
.mechip .lo{border:0;background:none;color:#8c99b3;font-size:12px;cursor:pointer;padding:4px 6px;border-radius:6px}
.mechip .lo:hover{color:#fff;background:rgba(255,255,255,.08)}
.acct{display:block;color:var(--faint);font-size:12px;font-weight:500;margin-top:2px}
.rolesel{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;padding:2px;background:var(--sunk);gap:2px}
.rolesel button{border:0;background:none;border-radius:6px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.rolesel button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}
td.act .btn+.btn{margin-left:6px}
.imp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 20px}
@media (max-width:760px){.mechip .nm{display:none}}
@media (max-width:600px){.membtn .t{display:none}.gate-card{padding:26px 20px}}

/* IC-v13 */
.gate-mk svg.i{width:20px;height:20px;color:#fff}
.mechip .lo{display:inline-flex;align-items:center;gap:5px}
.mechip .lo svg.i{width:14px;height:14px}
.membtn svg.i{width:16px;height:16px}
/* editorial overrides for header buttons (ops) */
.membtn{background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-weight:800}
.membtn:hover,.membtn[aria-current=true]{background:var(--pri);border-color:var(--pri);color:var(--surface)}
.mechip{color:var(--ink2);border-left-color:var(--line)}

@media (max-width:420px){.top .mpill #mPrev,.top .mpill #mNext{display:none}.top .mpill{padding:0 2px}}

/* 회원 관리: 부서·직급 */
.msel{min-width:118px;height:32px;padding:0 28px 0 10px;font-size:13px}
.lsgrid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.lsbox{padding:18px 24px;border-top:1px solid var(--line)}
.lsbox+.lsbox{border-left:1px solid var(--line)}
.lsbox h3{margin:0 0 12px;font-size:14.5px;font-weight:800;display:flex;align-items:baseline;gap:8px}
.lsbox h3 small{font-size:12px;color:var(--muted);font-weight:500}
.lschips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.lschip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line-strong);border-radius:999px;padding:3px 4px 3px 12px;font-size:13px;font-weight:600;background:var(--surface)}
.lschip button{border:0;background:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:var(--muted);cursor:pointer;padding:0}
.lschip button:hover:not([disabled]){background:var(--head);color:var(--ink)}
.lschip button[disabled]{opacity:.25;cursor:default}
.lschip .i{width:13px;height:13px}
.lsadd{display:flex;gap:6px}
.lsadd .in{flex:1;min-width:0;height:34px}
@media (max-width:760px){.lsgrid{grid-template-columns:1fr}.lsbox+.lsbox{border-left:0}.lsbox{padding:16px}}

.updbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:300;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.16);padding:10px 12px 10px 16px;max-width:calc(100vw - 24px);font-size:13.5px}
.updbar[hidden]{display:none}
.updbar .ub-dot{width:8px;height:8px;border-radius:50%;background:#e5484d;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,#e5484d 18%,transparent)}
.updbar .ub-t{color:var(--ink2)}
.updbar .ub-t b{color:var(--ink)}
.updbar .ub-x{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;padding:6px 4px}
@media (max-width:600px){.updbar{top:auto;bottom:16px;font-size:12.5px}.updbar .ub-t{flex:1}}
@media (max-width:960px){.top .logo .lt b{font-size:14.5px}.top .logo small{display:none}.mechip .lo span{display:none}.mechip .nm{max-width:90px;overflow:hidden;text-overflow:ellipsis}}

/* 회원 관리: 게시판 권한 · 묶어 보기 */
.bd-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-width:420px}
.bd{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:2px 9px;font:inherit;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.bd:hover{border-color:var(--ink);color:var(--ink)}
.bd.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.bd-note{display:block;margin-top:4px;font-size:11.5px;color:var(--muted)}
tr.mgrp td{background:var(--sunk);padding:8px 16px!important;border-top:2px solid var(--line-strong)}
tr.mgrp b{font-size:13px;margin-right:8px}tr.mgrp small{font-size:11.5px;color:var(--muted)}

.top .dchip{display:none!important}
</style>

/* ================= text helpers ================= */
function hi(s,q){s=esc(s);if(!q)return s;const qq=esc(q);const i=s.toLowerCase().indexOf(qq.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+qq.length)+'</mark>'+s.slice(i+qq.length)}
function person(v,q){const m=/^([가-힣A-Za-z]{2,4})(\d{1,2})$/.exec(String(v).trim());return m?`${hi(m[1],q)}<span class="cnt">${m[2]}</span>`:hi(v,q)}
function inline(s,q){let h=hi(s,q);h=h.replace(/^(\[[^\]]+\])/,'<span class="tag">$1</span>');h=h.replace(/^([^:<\[]{1,14}?)\s?:\s/,'<span class="tag">$1</span> : ');return h}
function fmt(t,q){
  let lines=String(t||'').split('\n');
  if(lines.length===1&&lines[0].length>90&&lines[0].includes(' / ')){const parts=lines[0].split(' / ').map(s=>s.trim()).filter(Boolean);if(parts.length>1)lines=parts.map(p=>'- '+p)}
  let out='',ul=false;const close=()=>{if(ul){out+='</ul>';ul=false}};
  for(const raw of lines){const l=raw.trim();let m;
    if(!l){close();continue}
    if((m=/^[-•·]\s*(.*)$/.exec(l))&&!/^-{2,}/.test(l)&&!/^->/.test(l)){if(!ul){out+='<ul>';ul=true}out+=`<li>${inline(m[1],q)}</li>`;continue}
    close();
    if(/^\*\*\s*/.test(l)){out+=`<div class="h">${inline(l.replace(/^\*\*\s*/,''),q)}</div>`;continue}
    if(/^[※*<⚠(]|^->/.test(l)){out+=`<div class="ref">${inline(l.replace(/^\*\s*/,''),q)}</div>`;continue}
    if((m=/^(\d{1,2}[\.\)])\s+(.*)$/.exec(l))){out+=`<div class="num-line"><b>${esc(m[1])}</b><span>${inline(m[2],q)}</span></div>`;continue}
    out+=`<p>${inline(l,q)}</p>`}
  close();return `<div class="fmt">${out}</div>`;
}
/* 교육 일정: 하루에 여러 개 · 한 줄에 '시간 | 교육명 | 강의장 | 교육자' 로 저장 */
const EDU_ROOM=/(회의실|강의장|강의실|세미나|라운지|교육장|\d+\s*호|\d+\s*층|온라인|줌|zoom)/i,EDU_WHO=/(님|멘토|팀장|부장|강사|원장|실장|선임|수석|책임|대표)$/,EDU_TIME=/^(\d{1,2}:\d{2})(\s*[~-]\s*\d{1,2}:\d{2})?/;
function eduItems(v){
  const L=String(v||'').split('\n').map(l=>l.trim()).filter(Boolean);const out=[];
  const mk=o=>{o.time=o.time||'';o.title=o.title||'';o.room=o.room||'';o.who=o.who||'';o.cat=o.cat||'';o.t=(o.time?o.time+' ':'')+o.title;o.m=[o.room,o.who].filter(Boolean).join(' · ');return o};
  L.forEach(l=>{
    if(l.includes('|')){let P=l.split('|').map(x=>x.trim());const t0=EDU_TIME.exec(P[0]);if(t0&&P[0].replace(EDU_TIME,'').trim())P=[t0[0].replace(/\s+/g,''),P[0].replace(EDU_TIME,'').trim(),...P.slice(1)];
      const [time,title0,room,who]=P;const cc=/^\[([^\]]+)\]\s*(.*)$/.exec(title0||'');out.push(mk({time,title:cc?cc[2]:title0,cat:cc?cc[1]:'',room,who}));return}
    const c=/^\[([^\]]+)\]\s*(.*)$/.exec(l);const last=out[out.length-1];
    if(c){out.push(mk({title:c[2],cat:c[1]}));return}
    const tm=EDU_TIME.exec(l);
    if(last&&!last.room&&EDU_ROOM.test(l)&&l.length<=20){last.room=l;mk(last);return}
    if(last&&!last.who&&EDU_WHO.test(l)&&l.length<=20){last.who=l;mk(last);return}
    if(last&&!last.time&&tm&&l.replace(EDU_TIME,'').trim().length<2){last.time=tm[0].replace(/\s+/g,'');mk(last);return}
    if(last&&/·/.test(l)&&!last.room){const ps=l.split('·').map(x=>x.trim());ps.forEach(x=>{if(EDU_TIME.test(x)&&!last.time)last.time=x;else if(EDU_WHO.test(x)&&!last.who)last.who=x;else if(!last.room)last.room=x});mk(last);return}
    out.push(mk(tm?{time:tm[0].replace(/\s+/g,''),title:l.replace(EDU_TIME,'').trim()}:{title:l}));
  });return out}
function eduSave(x,i,f,v,quiet){const run=()=>{const it=eduItems(S.doc.cal.edu[x]);if(!it[+i])return;if(f==='title'){const c=/^\[([^\]]+)\]\s*(.*)$/.exec(v);it[+i].cat=c?c[1]:'';it[+i].title=c?c[2]:v}else it[+i][f]=v;setCal('edu',x,eduText(it))};if(quiet){pushHist(snap());run();changed()}else mutate(run)}
const eduText=items=>items.filter(e=>e.time||e.title||e.room||e.who).map(e=>[e.time||'',(e.cat?`[${e.cat}] `:'')+(e.title||''),e.room||'',e.who||''].join(' | ')).join('\n');

const TN_TIERS=[['내사',18000000,'내사턴까지 포함','1,800만 이상'],['대표',13000000,'대표턴 포함','1,300만~1,799만'],['공식',10000000,'공식턴','1,000만~1,299만'],['올턴제한',10000000,'올턴 제한','999만 이하']];

function parseSales(text){
  const out=[];const seen=new Set();
  String(text||'').split(/\r?\n/).forEach(raw=>{let c=raw.includes('\t')?raw.split('\t'):raw.trim().split(/\s+/);c=c.map(x=>x.trim());
    if(c.length<3)return;const ni=c.findIndex(x=>/[가-힣]/.test(x));if(ni<0||/담당|이름|NO/i.test(c[ni])||/[()]/.test(c[ni]))return;
    if(!/^[가-힣]{2,5}\d*$/.test(c[ni]))return;let last='';for(let i=c.length-1;i>ni;i--){if(c[i]!==''){last=c[i];break}}
    if(!/^-?[\d,]+$/.test(last))return;const amt=Number(last.replace(/,/g,''));const nm=c[ni];if(seen.has(nm))return;seen.add(nm);out.push({name:nm,amt})});
  return out;
}

const GAP=4;
function autoFill(k,opt){
  const cal=S.doc.cal,mem=cal[GK[k].mem],[a,z]=periodDays();
  const hol=x=>HOL.test(cal.memo?.[x]||'');
  const cnt={},wdc={};opt.groups.forEach(g=>{cnt[g]=0;wdc[g]=[0,0,0,0,0,0,0]});
  const dates=[];
  for(let x=a;x<=z;x=addDays(x,1)){const wd=parse(x).getDay();if(!opt.days.includes(wd))continue;if(opt.skipHol&&hol(x))continue;
    const g=groupOf(cal[k][x]);
    if(opt.mode==='empty'&&cal[k][x]){if(g&&cnt[g]!=null){cnt[g]++;wdc[g][wd]++}continue}
    dates.push(x)}
  const prevG=x=>{for(let i=1;i<=3;i++){const y=addDays(x,-i);if(opt.days.includes(parse(y).getDay()))return groupOf(cal[k][y])}return null};
  if(opt.mode==='all')dates.forEach(x=>{delete cal[k][x];delete mem[x]});
  for(const x of dates){const wd=parse(x).getDay(),pg=prevG(x);
    /* 같은 조는 앞뒤 3일 안에 다시 넣지 않음 → 최소 4일 간격 */
    const near=g=>{for(let i=1;i<=GAP-1;i++){if(groupOf(cal[k][addDays(x,-i)])===g||groupOf(cal[k][addDays(x,i)])===g)return GAP-i}return 0};
    const best=opt.groups.map(g=>[near(g)*1e6+cnt[g]*100+wdc[g][wd]*10+(g===pg?60:0)+Math.random()*5,g]).sort((p,q)=>p[0]-q[0])[0][1];
    cal[k][x]=best+'조';delete mem[x];cnt[best]++;wdc[best][wd]++}
  let wk=0;

}

const AUTH_MSG={"auth/invalid-credential":"이메일 또는 비밀번호가 맞지 않습니다.","auth/invalid-login-credentials":"이메일 또는 비밀번호가 맞지 않습니다.","auth/wrong-password":"비밀번호가 맞지 않습니다.","auth/user-not-found":"가입되지 않은 이메일입니다. ‘가입 신청’에서 먼저 신청해 주세요.","auth/email-already-in-use":"이미 있는 계정입니다. 그 비밀번호로 로그인하면 이어서 신청할 수 있습니다.","auth/weak-password":"비밀번호는 6자 이상이어야 합니다.","auth/invalid-email":"이메일 형식이 맞지 않습니다.","auth/too-many-requests":"시도가 너무 많습니다. 잠시 뒤 다시 해 주세요.","auth/network-request-failed":"인터넷 연결을 확인해 주세요.","permission-denied":"저장 권한이 없습니다. 관리자에게 문의해 주세요."};

/* 기존 화면 코드가 쓰던 저장소 모양(collection/doc/onSnapshot/set/delete)을 Firestore 에 맞춰 줌 */
/* Firestore 는 '목록 안의 목록'을 저장하지 못해서, 저장할 때 감싸고 읽을 때 풉니다 */
const fsEnc=v=>Array.isArray(v)?v.map(x=>Array.isArray(x)?{__a:fsEnc(x)}:fsEnc(x)):(v&&typeof v==='object')?Object.fromEntries(Object.entries(v).filter(([,x])=>x!==undefined).map(([k,x])=>[k,fsEnc(x)])):v;
const fsDec=v=>Array.isArray(v)?v.map(fsDec):(v&&typeof v==='object')?((Object.keys(v).length===1&&'__a' in v)?fsDec(v.__a):Object.fromEntries(Object.entries(v).map(([k,x])=>[k,fsDec(x)]))):v;
function fsAdapter(fdb){
  const map=p=>{const a=p.split('/');a[0]=COL[a[0]]||a[0];return a.join('/')};
  const wrapDoc=s=>({id:s.id,exists:s.exists,data:()=>fsDec(s.data())});
  return {
    collection:n=>({onSnapshot:(cb,err)=>fdb.collection(map(n)).onSnapshot(s=>cb({docs:s.docs.map(wrapDoc)}),e=>err&&err({code:e.code}))}),
    doc:p=>{const r=fdb.doc(map(p));return {set:(d,o)=>o?r.set(fsEnc(d),o):r.set(fsEnc(d)),delete:()=>r.delete(),get:()=>r.get().then(wrapDoc),onSnapshot:(cb,err)=>r.onSnapshot(s=>cb(wrapDoc(s)),e=>err&&err({code:e.code}))}}
  };
}

function authStart(){
  if(!window.firebase){A.mode='nofb';render();return}
  if(!FB_CFG.apiKey||!FB_CFG.projectId||/여기/.test(FB_CFG.apiKey)){A.mode='nocfg';render();return}
  A.fb=firebase.apps.find(a=>a.name==='ops')||firebase.initializeApp(FB_CFG,'ops');
  A.auth=A.fb.auth();A.fdb=A.fb.firestore();try{A.fdb.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{A.fdb.collection('ops_meta').doc('lists').onSnapshot(s=>{A.lists=s.exists?s.data():null;if(S.tab==='members'||A.mode!=='in'){S.keepScroll=true;render()}},()=>{})}catch(e){}
  A.auth.onAuthStateChanged(u=>{
    A.user=u;if(A.unsubMe){A.unsubMe();A.unsubMe=null}if(A.unsubU){A.unsubU();A.unsubU=null}
    if(!u){A.prof=null;A.mode=A.mode==='signup'?'signup':'login';S.db=null;render();return}
    A.mode='wait';render();
    A.unsubMe=A.fdb.collection('ops_users').doc(u.uid).onSnapshot(async s=>{
      A.prof=s.exists?s.data():null;
      if(isOwnerA()&&(!A.prof||A.prof.status!=='approved'||A.prof.role!=='edit')){
        try{await A.fdb.collection('ops_users').doc(u.uid).set({...(A.prof||{}),uid:u.uid,email:(u.email||'').toLowerCase(),name:A.prof?.name||'김태욱',dept:A.prof?.dept||'사업부 3부서',status:'approved',role:'edit',owner:true,createdAt:A.prof?.createdAt||new Date().toISOString(),decidedAt:new Date().toISOString()})}catch(e){}
      }
      if(approved()){A.mode='in';if(!CAN())S.edit=false;startData();if(isOwnerA()&&!A.unsubU)watchUsers()}
      else A.mode=A.prof?(A.prof.status==='rejected'?'rejected':A.prof.status==='removed'?'removed':'pending'):'apply';
      renderChrome();render();
    },e=>{A.mode='apply';A.err=authMsg(e);render()});
  });
}

function parseWkend(text){
  const NOT=/^(오전|오후|지원|미지원|토요일|일요일|사용자가)$/;const who={},order=[];let cur=null,inMsg=false;
  String(text||'').split(/\r?\n/).forEach(raw=>{const l=raw.replace(/ /g,' ').trim();if(!l)return;
    if(/^\d+$/.test(l)||/^(오전|오후)\s*\d{1,2}:\d{2}$/.test(l)||/^\d{4}년\s*\d{1,2}월\s*\d{1,2}일/.test(l)||/^[\[*]/.test(l)||/삭제한 대화/.test(l))return;
    if(/^[가-힣]{2,4}$/.test(l)&&!NOT.test(l)){if(l!==cur){cur=l;inMsg=false}return}
    const m=l.match(/^(토|일|토\s*[,/·&]?\s*일|토요일|일요일)\s*[-–:~]?\s*(지원|가능|O|o)\s*$/);
    if(m&&cur&&!/미지원|불가/.test(l)){if(!inMsg){who[cur]=new Set();inMsg=true;if(!order.includes(cur))order.push(cur)}const d=m[1];if(/토/.test(d))who[cur].add('토');if(/일/.test(d.replace('토요일','')))who[cur].add('일')}
  });
  const sat=order.filter(n=>who[n].has('토')),sun=order.filter(n=>who[n].has('일'));return {sat,sun,n:order.length};
}

function clImport(t,quick){const day=S.cdate||todayIso();S.clExt=quick?'':t;const r=parseExt(t,day);const ns=Object.keys(r.sum);
  if(!ns.length){S.clExtRes='상담원 이름과 통화 시간을 찾지 못했습니다';if(quick)toast('붙여넣은 내용에서 상담원 이름과 통화 시간을 찾지 못했습니다');S.keepScroll=true;render();return}
  logAdd('calls',[`${md(day)} 내선 통화내역 붙여넣기 (${ns.length}명)`]);const rows={};ns.forEach(n=>rows[n]={et:String(r.sum[n].t),ec:String(r.sum[n].c)});
  callsWrite(day,{rows}).then(()=>{S.clExtRes=`${r.rows}건 · ${ns.length}명 내선 칸에 넣었습니다${r.skip?` (다른 날짜 ${r.skip}건 제외)`:''}`;toast(`${md(day)} 내선 통화량 ${ns.length}명 넣었습니다`);S.keepScroll=true;render()})}
function parseExt(text,day){
  const R=callRoster();const names=new Set(R.map(x=>x.name));const sum={};let rows=0,skip=0;
  String(text||'').split(/\r?\n/).forEach(l=>{const c=(l.includes('\t')?l.split('\t'):l.trim().split(/\s{2,}|\s+/)).map(x=>x.trim());if(c.length<2)return;
    const nm=c.find(x=>names.has(x)||names.has(x.replace(/\d+$/,'')));if(!nm){return}
    const dc=c.find(x=>/^\d{4}[-./]\d{1,2}[-./]\d{1,2}/.test(x));if(dc&&day){const m=dc.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);const iso=`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;if(iso!==day){skip++;return}}
    const tc=[...c].reverse().find(x=>/^\d{1,2}:\d{2}(:\d{2})?$/.test(x));if(!tc)return;const n=nm.replace(/\d+$/,'');sum[n]=sum[n]||{t:0,c:0};sum[n].t+=secOf(tc.split(':').length===2?'0:'+tc:tc);sum[n].c++;rows++});
  return {sum,rows,skip};
}

function monthCover(x){const ids=Object.keys(S.months).sort();if(S.id&&S.doc){const [a,z]=perOf(S.id);if(a&&z&&x>=a&&x<=z)return S.id}for(const id of ids){const [a,z]=perOf(id);if(a&&z&&x>=a&&x<=z)return id}return null}

function jStrong(text,r){const q=jnorm(text);if(!q)return null;
  for(const c of r.courses)if(jnorm(c.n)===q)return jCourse(c);
  for(const d of r.depts){if(jnorm(d.d)===q)return jDept(d);for(const a of String(d.a||'').split(','))if(jnorm(a)&&jnorm(a)===q)return jDept(d,'학과 다른 이름')}
  if(q.length>=3)for(const d of r.depts)if(jnorm(d.d).includes(q))return jDept(d,'학과명 일부');
  if(q.length>=3)for(const c of r.courses)if(jnorm(c.n).indexOf(q)===0)return jCourse(c);
  if(q.length>=3)for(const c of r.courses){const n=jnorm(c.n);if(n.includes(q)||q.includes(n))return jCourse(c,'과정명 일부')}
  return null}
function jOne(text,r){const st=jStrong(text,r);if(st)return st;const q=jnorm(text);
  for(const k of r.keywords)for(const w0 of String(k.words||'').split(',')){const w=jnorm(w0);if(w.length>=2&&q.includes(w))return {turn:k.t,step:'키워드',why:`<b>${esc(w0.trim())}</b> · ${esc(k.label)} 규칙`,flag:(k.f?k.f+' / ':'')+'등록된 과정명이 아니라 확인이 필요합니다'}}
  return null}
const jNone=()=>({turn:'etc',step:'미분류',why:'과정 목록과 학과, 키워드 어디에도 걸리지 않아 기타턴으로 보냅니다.',flag:'판정 근거가 없습니다. 아래 기준 관리에서 과정이나 키워드를 추가해 주세요'});
function judge(input,sns){const r=jRules();const text=String(input||'').trim();if(!text)return null;
  const pr=r.priority&&r.priority.length?r.priority:['official','ai','oa','fb','etc'];const rank=t=>{const i=pr.indexOf(t);return i<0?99:i};let out;
  if(!/[,;|\n\t]/.test(text)){out=jOne(text,r);if(out&&out.step==='키워드')out.why='홈페이지 표기와 달라 키워드로 판정했습니다. '+out.why+'.';if(!out)out=jNone()}
  else{const hits=[];text.split(/[,;|\n\t]+/).map(x=>x.trim()).filter(Boolean).forEach(sg=>{const h=jOne(sg,r);if(h){hits.push({s:sg,h});return}sg.split(/[\s/·・]+/).map(x=>x.trim()).filter(Boolean).forEach(tk=>{const th=jOne(tk,r);if(th)hits.push({s:tk,h:th})})});
    if(!hits.length)out=jNone();else{const subj=hits.filter(x=>x.h.step!=='학과');const pool=subj.length?subj:hits;let best=pool[0];pool.forEach(x=>{if(rank(x.h.turn)<rank(best.h.turn))best=x});
      const many=new Set(pool.map(x=>x.h.turn)).size>1;const parts=hits.map(x=>`${esc(x.s)} → ${JL[x.h.turn]}${x.h.step==='학과'?'(학과)':''}`).join(', ');
      const tail=subj.length&&subj.length<hits.length?`과정이 학과보다 앞서므로 학과 표기는 참고만 하고 <b>${JL[best.h.turn]}</b>으로 보냅니다.`:many?`배정우선순위에 따라 <b>${JL[best.h.turn]}</b>으로 보냅니다.`:'모두 같은 턴입니다.';
      out={turn:best.h.turn,step:'복합',why:`한 칸에 여러 항목이 적혀 있습니다. ${parts}. ${tail}`,flag:many?'성격이 다른 항목이 섞여 있으니 상담 내용을 한 번 확인해 주세요':(best.h.flag||'')}}}

  return out}

document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey,inField=e.target.closest?.('input,textarea,[contenteditable]');

  if(asgActive()&&!inField&&e.key!=='Escape'&&!(mod&&['c','x','v','z','y','s'].includes(e.key.toLowerCase()))){if(asgKey(e)){e.preventDefault();return}}

  if(e.key==='Escape'&&S.ttBig){S.ttBig=false;S.keepScroll=true;render();return}
  if(e.key==='Escape'&&S.printOpen){S.printOpen=false;S.keepScroll=true;render();return}

  if(S.pop&&GK[S.pop.key]&&CAN()&&!inField&&!mod){const k=S.pop.key,x=S.pop.date;const key=e.key.toUpperCase();const gi='12345'.indexOf(e.key);const G=GROUPS.includes(key)?key:gi>=0?GROUPS[gi]:null;
    if(G){e.preventDefault();S.edit=true;mutate(()=>{setCal(k,x,G+'조');delete S.doc.cal[GK[k].mem][x]});const n=stepDay(k,x,1);if(n)S.pop={key:k,date:n};S.keepScroll=true;render();return}
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();mutate(()=>{setCal(k,x,'');delete S.doc.cal[GK[k].mem][x]});return}
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const n=stepDay(k,x,e.key==='ArrowRight'?1:-1);if(n){S.pop={key:k,date:n};S.keepScroll=true;render()}return}}
  if(e.key==='Escape'&&S.gswap){S.gswap=null;S.keepScroll=true;render();return}
  if(e.key==='Escape'&&(S.pop||S.rand||S.renAsk)){S.pop=null;S.rand=null;S.renAsk=false;S.keepScroll=true;render();return}
  if(S.saveAsk){if(e.key==='Escape'){e.preventDefault();S.saveAsk=false;S.keepScroll=true;render();return}if(e.key==='Enter'||(mod&&e.key.toLowerCase()==='s')){e.preventDefault();S.saveAsk=false;save();return}}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();askSave();return}
  if(mod&&!inField&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&!inField&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.cell,.ag,.mc-c,[data-rsel],[data-csel]')&&!inField){e.preventDefault();e.target.click();return}
  if(e.target.matches?.('.cl-in')&&['Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){if(e.isComposing||e.keyCode===229)return;
    const all=[...document.querySelectorAll('.cl-in')];const i=all.indexOf(e.target);const per=all.filter(x=>x.closest('tr')===e.target.closest('tr')).length||1;
    let j=i;const k=e.key;
    if(k==='Enter'||k==='Tab')j=e.shiftKey?i-1:i+1;else if(k==='ArrowRight')j=i+1;else if(k==='ArrowLeft')j=i-1;else if(k==='ArrowDown')j=i+per;else if(k==='ArrowUp')j=i-per;
    const nx=all[j];e.preventDefault();if(!nx)return;const key=nx.dataset.cl;nx.focus();const q=document.querySelector(`.cl-in[data-cl="${key}"]`);if(q&&document.activeElement!==q)q.focus();q?.select?.();return}
  if(e.key==='Enter'&&e.target.matches?.('.tv-in,.tv-add')){if(e.isComposing||e.keyCode===229)return;e.preventDefault();e.target.blur();return}
  if(e.key==='Enter'&&e.target.id==='stIn'){if(e.isComposing||e.keyCode===229)return;e.preventDefault();act(document.querySelector('[data-stadd]'));setTimeout(()=>$('#stIn')?.focus(),30);return}
  if(e.key==='Enter'&&e.target.id==='acIn'){if(e.isComposing||e.keyCode===229)return;e.preventDefault();e.target.blur();return}
  if(e.key==='Escape'&&(S.acell||S.asel)){S.asel=null;S.acell=null;S.keepScroll=true;render();return}
  if(e.key==='Enter'&&e.target.matches?.('.tm-in')){if(e.isComposing||e.keyCode===229)return;e.preventDefault();const id=e.target.id,[,k,ti]=id.split('-');const n=e.target.value.trim();if(!n)return;const t=teamsOf(k)[+ti];if(t.members.includes(n)){toast('이미 들어 있습니다');return}const dup=teamsOf(k).findIndex((x,i)=>i!==+ti&&x.members.includes(n));S.edit=true;mutate(()=>{if(dup>=0)teamsOf(k)[dup].members=teamsOf(k)[dup].members.filter(y=>y!==n);t.members.push(n)});if(dup>=0)toast(`${n}: 다른 묶음에서 옮겼습니다`);const f=()=>{const el=document.getElementById(id);if(el&&document.activeElement!==el){el.value='';el.focus({preventScroll:true})}};f();requestAnimationFrame(f);setTimeout(f,60);return}

});

function onInput(t){
  if(!t||!t.dataset)return;

    if(t.dataset.p)setPath(t.dataset.p,t.innerText.replace(/\n$/,''));else setCal(t.dataset.cal,t.dataset.d,t.value);changed();

  if(t.dataset&&t.dataset.cl){const [n,k]=sp(t.dataset.cl);let v=t.value.trim();if(k==='pt'||k==='et'){v=v?String(secOf(v)):''}else if(k==='amt')v=manOf(v);else v=v.replace(/[^\d]/g,'');{const old=S.callsAll?.[S.cdate||todayIso()]?.rows?.[n]?.[k]??'';if(String(old)!==String(v))logCall(S.cdate||todayIso(),n,k,v)}callsWrite(S.cdate||todayIso(),{rows:{[n]:{[k]:v}}}).then(()=>{S.keepScroll=true;render()});return}

  if(t.id==='clLockT'&&/^\d{2}:\d{2}$/.test(t.value)){const cur=S.callsAll?.['_settings']||{};logAdd('calls',[`통화량 잠그는 시간: 다음날 ${t.value}`]);callsWrite('_settings',{...(cur.v2?{}:CALL_DEF),lockAt:t.value,v2:true}).then(()=>{toast(`다음날 ${t.value}에 잠기도록 바꿨습니다`);S.keepScroll=true;render()});return}
