<style>

/* Layout: 홈페이지형. 흰 상단 헤더(로고·가로 메뉴·월 선택) → 페이지마다 연한 색 띠의 머리(큰 제목+하위 탭) → 1160px 본문.
   글꼴은 프리텐다드를 페이지에 직접 넣어 어디서 열어도 같은 모양. 장식은 줄이고 여백·글자 크기로 위계를 만든다. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#f8f9fb; --head:#f3f5f8; --ink:#111827; --ink2:#374151; --muted:#6b7280; --faint:#9ca3af; --line:#eceef2; --line-strong:#dde1e7;
  --accent:#2f5bea; --accent-ink:#ffffff; --accent-soft:#edf2ff; --accent-line:#c7d4fb;
  --com:#0d8a7b; --com-soft:#e7f6f3; --com-line:#b5e3db;
  --hero:#eef2fb; --hero-c:#e9f6f3;
  --warn:#c2410c; --warn-soft:#fff3ec; --ok:#15803d; --ok-soft:#ebf8ef; --hl:#f59e0b;
  --gA:#d97706; --gB:#2563eb; --gC:#9333ea; --gD:#16a34a; --gE:#e11d48; --mix:12%;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 1px 8px rgba(17,24,39,.04);
  --shadow-lg:0 16px 40px rgba(17,24,39,.16);
  --f-body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
  --r:16px; --wrap:1160px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#151922; --sunk:#181d27; --head:#1c2230; --ink:#f3f4f6; --ink2:#d1d5db; --muted:#9ca3af; --faint:#6b7280; --line:#232a37; --line-strong:#2e3646;
  --accent:#7d9bff; --accent-ink:#0b1430; --accent-soft:#1a2444; --accent-line:#33457e;
  --com:#4fd1bd; --com-soft:#11302b; --com-line:#21564e;
  --hero:#141b2c; --hero-c:#112523;
  --warn:#fb923c; --warn-soft:#33200f; --ok:#4ade80; --ok-soft:#10291a; --hl:#fbbf24;
  --gA:#fbbf24; --gB:#60a5fa; --gC:#c084fc; --gD:#4ade80; --gE:#fb7185; --mix:20%;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#151922; --sunk:#181d27; --head:#1c2230; --ink:#f3f4f6; --ink2:#d1d5db; --muted:#9ca3af; --faint:#6b7280; --line:#232a37; --line-strong:#2e3646;
  --accent:#7d9bff; --accent-ink:#0b1430; --accent-soft:#1a2444; --accent-line:#33457e;
  --com:#4fd1bd; --com-soft:#11302b; --com-line:#21564e;
  --hero:#141b2c; --hero-c:#112523;
  --warn:#fb923c; --warn-soft:#33200f; --ok:#4ade80; --ok-soft:#10291a; --hl:#fbbf24;
  --gA:#fbbf24; --gB:#60a5fa; --gC:#c084fc; --gD:#4ade80; --gE:#fb7185; --mix:20%;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;font-feature-settings:"ss06"}
select,input,button,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ===== header ===== */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:8px 18px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;flex:none}
.logo .mk{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.02em}
.logo b{font-size:16.5px;font-weight:800;letter-spacing:-.03em}
.nav{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;border:0;background:none;padding:8px 11px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--ink);background:var(--sunk)}
.nav button[aria-current=true]{color:var(--ink);background:var(--head)}
.nav .sep{flex:none;width:1px;height:18px;background:var(--line-strong);margin:0 8px}
.nav .lab{flex:none;font-size:11.5px;font-weight:700;color:var(--com);padding:0 4px 0 2px}
.hdr-r{display:flex;align-items:center;gap:6px;flex:none}
.mpill{display:flex;align-items:center;gap:0;border:1px solid var(--line-strong);border-radius:999px;padding:2px;background:var(--surface)}
.mpill select{border:0;background:none;font-weight:700;font-size:13.5px;padding:4px 2px;max-width:150px;cursor:pointer}
.mpill .ib{width:28px;height:28px}
.compill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;background:var(--com-soft);color:var(--com);font-weight:700;font-size:13px}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:999px;border:0;background:transparent;color:var(--ink2);cursor:pointer}
.ib:hover:not([disabled]){background:var(--head)}
.ib[disabled]{opacity:.3;cursor:default}
.switch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink2);border-radius:999px;padding:4px 12px 4px 5px;min-height:34px;cursor:pointer;font-weight:700;font-size:13px}
.switch .k{width:30px;height:18px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .15s}
.switch .k::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.switch[aria-pressed=true] .k{background:var(--accent)}
.switch[aria-pressed=true] .k::after{transform:translateX(12px)}
.menu-wrap{position:relative}
.dd{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:180px;z-index:60}
.dd button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;text-align:left;color:var(--ink2)}
.dd button:hover{background:var(--head)}

/* ===== hero (page head) ===== */
.hero{background:linear-gradient(180deg,var(--hero),var(--bg));border-bottom:1px solid var(--line)}
.c-page .hero{background:linear-gradient(180deg,var(--hero-c),var(--bg))}
.hero-in{padding-block:34px 0}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px}
.c-page .kicker{color:var(--com)}
.hero h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.25;text-wrap:balance}
.hero p{margin:8px 0 0;color:var(--muted);font-size:15px;max-width:64ch}
.hero-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.hero-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:22px 0 16px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid transparent;background:none;padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.subtabs button:hover{color:var(--ink);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.subtabs button[aria-selected=true]{background:var(--ink);color:var(--surface)}
.subtabs .n{font-size:12px;font-weight:700;opacity:.6}
.hero-sp{height:26px}
main{padding-block:26px 120px}
.combar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--com);margin-bottom:16px;font-weight:600}

/* ===== controls ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:7px 14px;min-height:38px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;color:var(--ink2)}
.btn:hover:not([disabled]){border-color:var(--ink2);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{opacity:.88;color:var(--surface)}
.btn.blue{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue:hover{opacity:.9;color:var(--accent-ink)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.btn.danger:hover{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.btn.sm{min-height:32px;padding:3px 11px;font-size:13px;border-radius:8px}
.btn.xs{min-height:26px;padding:0 8px;font-size:12.5px;border-radius:7px;font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--head);color:var(--ink)}
.btn.link{border:0;background:none;color:var(--accent);padding:0 4px;min-height:0;text-decoration:underline}
input[type=date],input[type=month],input[type=text],input[type=search],select.in,textarea.in{background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:7px 12px;min-height:38px;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;flex:1;min-width:220px}
.search input{width:100%;padding-left:40px;min-height:46px;border-radius:12px;font-size:15px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:2}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--head);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ===== cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;min-width:0;overflow:hidden;scroll-margin-top:84px;box-shadow:var(--shadow)}
.card-hd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:18px 22px 14px}
.card-hd h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;min-width:0}
.card-hd .sub{color:var(--muted);font-size:13.5px;flex-basis:100%;margin:0}
.card-hd .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-bd{padding:4px 22px 22px}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr));gap:0 20px;align-items:start}
.flow>.wide{grid-column:1/-1}
.flow.one{grid-template-columns:1fr}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:0 20px;align-items:start}
.editing .card{box-shadow:0 0 0 1.5px var(--accent-line)}
.sect-h{display:flex;align-items:center;gap:10px;margin:8px 0 12px;font-size:14px;font-weight:800;color:var(--ink2)}
.sect-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== tables ===== */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
thead th{background:var(--sunk);color:var(--muted);font-weight:700;font-size:12.5px;text-align:left;padding:10px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;color:var(--ink2)}
tbody tr:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.ctr,th.ctr{text-align:center}
td.strong{font-weight:700;color:var(--ink)}
td.calc{color:var(--accent);font-weight:700}
td.neg{color:var(--warn);font-weight:600}
td.pos{color:var(--ok)}
td.grp{font-weight:700;color:var(--ink)}
td.cont{color:transparent}
td.nw,th.nw{white-space:nowrap}
td.lg{min-width:16em}
tr.tier td{border-top:2px solid var(--line-strong)}
td.empty-cell{color:var(--muted);text-align:center;padding:30px}
.won{color:var(--faint);font-size:12px;margin-left:2px}
.cnt{display:inline-block;margin-left:5px;font-size:11px;font-weight:700;color:var(--muted);background:var(--head);border-radius:5px;padding:0 5px;vertical-align:1px}
table.kv{border-top:1px solid var(--line)}
table.kv th{width:240px;background:transparent;color:var(--ink);font-weight:700;font-size:14px;text-align:left;vertical-align:top;padding:14px 22px;border-bottom:1px solid var(--line)}
table.kv th.nw{white-space:nowrap}
table.kv td{padding:14px 22px 14px 0;border-bottom:1px solid var(--line);background:transparent!important}
table.kv tr:last-child th,table.kv tr:last-child td{border-bottom:0}
table.kv tr:hover td,table.kv tr:hover th{background:transparent}
.fmt p{margin:0 0 6px}
.fmt p:last-child,.fmt ul:last-child{margin-bottom:0}
.fmt ul{margin:2px 0 8px;padding-left:18px}
.fmt li{margin:3px 0}
.fmt li::marker{color:var(--faint)}
.fmt .ref{color:var(--muted);font-size:13.5px;padding-left:12px;border-left:2px solid var(--line-strong);margin:5px 0}
.fmt .h{font-weight:800;margin:10px 0 4px;color:var(--ink)}
.fmt .num-line{display:flex;gap:8px;margin:3px 0}
.fmt .num-line b{color:var(--accent);flex:none}
.fmt .tag{font-weight:700;color:var(--ink)}

/* edit bits */
td.hd,th.hd{width:30px;padding:8px 4px!important;text-align:center;color:var(--faint)}
td.act,th.act{width:1%;white-space:nowrap;padding:6px 10px!important;text-align:right}
.grip{display:inline-grid;place-items:center;width:24px;height:26px;border-radius:6px;cursor:grab;color:var(--faint);touch-action:none;user-select:none;font-size:14px;line-height:1}
.grip:hover{background:var(--head);color:var(--accent)}
th .colx{border:0;background:none;color:var(--faint);cursor:pointer;padding:0 3px;margin-left:4px;border-radius:4px;font-size:13px}
th .colx:hover{color:var(--warn);background:var(--warn-soft)}
th [contenteditable]{display:inline-block;min-width:2em;padding:1px 4px}
[contenteditable]{outline:none}
.editing [contenteditable]{background:color-mix(in srgb,var(--accent) 6%,var(--surface));border-radius:6px}
.editing td[contenteditable],.editing th[contenteditable]{background:color-mix(in srgb,var(--accent) 4%,var(--surface))!important;border-radius:0}
.editing td[contenteditable]:hover,.editing th[contenteditable]:hover{box-shadow:inset 0 0 0 1px var(--accent-line)}
.editing .seat [contenteditable]{background:transparent}
.editing [contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--accent)!important;background:var(--surface)!important}
[contenteditable][data-ph]:empty::before{content:attr(data-ph);color:var(--faint)}
.addbar{display:flex;flex-wrap:wrap;gap:6px;padding:12px 22px;border-top:1px solid var(--line);background:var(--sunk)}
.bk-tools{display:flex;gap:4px;align-items:center}
.card-hd h2 [contenteditable]{padding:1px 6px}
.card-hd .sub[contenteditable]{padding:2px 6px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warn-soft);color:var(--warn);padding:12px 22px;font-size:14px}
.addblock{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:22px;border:1.5px dashed var(--line-strong);border-radius:var(--r);margin-bottom:20px;color:var(--muted);font-size:14px}

/* ===== chips ===== */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--head);color:var(--muted);line-height:1.6}
.g-A{--g:var(--gA)}.g-B{--g:var(--gB)}.g-C{--g:var(--gC)}.g-D{--g:var(--gD)}.g-E{--g:var(--gE)}
.chip[class*="g-"]{background:color-mix(in srgb,var(--g) var(--mix),transparent);color:var(--g)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .person{border:1px solid var(--line);border-radius:10px;padding:7px 14px;background:var(--sunk);font-weight:700}
.pchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line-strong);border-radius:999px;padding:3px 5px 3px 12px;font-size:13.5px;font-weight:600;background:var(--surface);white-space:nowrap}
.px{border:0;background:none;color:var(--faint);cursor:pointer;padding:0 5px;font-size:16px;line-height:1;border-radius:999px}
.px:hover{color:var(--warn);background:var(--warn-soft)}
[data-drag]{touch-action:none;user-select:none;-webkit-user-select:none}
.chip[data-drag],.gbt[data-drag],.pchip[data-drag]{cursor:grab}

/* ===== banners, toast, savebar ===== */
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn);margin-bottom:16px;font-size:14px;font-weight:600}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:20px;display:grid;gap:14px;box-shadow:var(--shadow-lg)}
.panel h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.03em}
.panel p{margin:0;color:var(--muted);font-size:14px}
.frow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.frow label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:80;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#savebar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
#savebar .in{pointer-events:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 18px;box-shadow:var(--shadow-lg);max-width:100%}
#savebar .dot{width:8px;height:8px;border-radius:50%;background:var(--hl);flex:none}
#savebar .t{font-size:14px;font-weight:700;margin-right:6px}
#savebar .k{font-size:12px;color:var(--faint);font-weight:600}

/* ===== home ===== */
.today-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;padding:26px 0 30px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 16px;min-width:0;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--g,var(--line-strong))}
.stat .lab{font-size:13px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.stat .val{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.1;color:var(--g,var(--ink))}
.stat .val.txt{font-size:17px;font-weight:700;white-space:pre-wrap;color:var(--ink);letter-spacing:-.02em;line-height:1.4}
.stat .val.none{color:var(--faint);font-weight:600}
.stat .ppl{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;font-weight:600;color:var(--ink2)}
.stat .go{margin-top:auto;align-self:flex-start;margin-left:-8px}
.evt{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.evt+.evt{padding-top:8px;border-top:1px solid var(--line)}
.evt .t{font-weight:700;font-size:15px}
.evt .m{font-size:13px;color:var(--muted)}
.shift{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:15px;font-weight:600}
.shift b{font-weight:700;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;padding-top:1px}
.daynav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:4px 22px 22px}
.wday{border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;min-height:96px;cursor:pointer;display:flex;flex-direction:column;gap:5px;background:var(--surface);text-align:left}
.wday:hover{border-color:var(--line-strong);background:var(--sunk)}
.wday.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.wday .d{font-size:13px;font-weight:800;color:var(--ink2);display:flex;justify-content:space-between}
.wday .d i{font-style:normal;color:var(--faint);font-weight:600}
.wday .d.sun i,.wday .d.sun{color:var(--warn)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;padding:4px 22px 22px}
.quick button{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;cursor:pointer;color:var(--ink)}
.quick button:hover{border-color:var(--com-line);background:var(--com-soft)}
.quick .qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--com-soft);color:var(--com);flex:none}
.quick b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.quick small{display:block;color:var(--muted);font-size:13px}

/* ===== calendars ===== */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.cal .hd{padding:10px;font-size:12.5px;color:var(--muted);font-weight:700;text-align:center;border-bottom:1px solid var(--line)}
.cal .hd.sun,.cal .dn.sun{color:var(--warn)}
.cal .hd.sat,.cal .dn.sat{color:var(--accent)}
.cal .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 8px 10px;min-height:108px;display:flex;flex-direction:column;gap:5px;cursor:pointer;background:var(--surface);min-width:0;transition:background .1s}
.cal .cell:nth-child(7n){border-right:0}
.cal.c5 .cell:nth-child(7n){border-right:1px solid var(--line)}
.cal.c5 .cell:nth-child(5n){border-right:0}
.cal .cell.out{background:var(--sunk)}
.cal .cell.out .dn{opacity:.45}
.cal .cell.today .dn>span:first-child{background:var(--ink);color:var(--surface);border-radius:7px;padding:0 7px}
.cal .cell:hover{background:var(--sunk)}
.cal .cell.picked,.ag.picked{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.cal .dn{font-size:13.5px;font-weight:800;display:flex;justify-content:space-between;align-items:flex-start;gap:4px;font-variant-numeric:tabular-nums}
.cal .hol{font-size:11.5px;color:var(--warn);font-weight:700;text-align:right;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}
.cal .chip{font-size:12px;padding:1px 8px;justify-content:center;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cal .gbig{display:flex;align-items:center;justify-content:center;border-radius:10px;padding:6px 4px;font-weight:800;font-size:15px;letter-spacing:-.02em;background:color-mix(in srgb,var(--g,var(--muted)) var(--mix),transparent);color:var(--g,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .gbig.txt{font-size:12.5px;font-weight:700;white-space:normal;text-align:center;line-height:1.3}
.cal .ce{font-size:12px;line-height:1.4;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:5px 7px}
.cal .ce b{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cal .ce span{opacity:.75;display:block}
.cal .co{font-size:12px;line-height:1.55;color:var(--ink2);border-radius:8px;padding:4px 7px;background:var(--sunk)}
.cal .co span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .co b{font-weight:700;color:var(--muted);font-size:11px;margin-right:4px;font-variant-numeric:tabular-nums}
.cal .pl{font-size:12px;line-height:1.5;color:var(--muted);word-break:keep-all;font-weight:500}
.pl span{display:inline-block;white-space:nowrap;margin-right:6px}
.agenda{display:none}
.ag{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:13px 18px;border-top:1px solid var(--line);cursor:pointer}
.ag:hover{background:var(--sunk)}
.ag.today{box-shadow:inset 3px 0 0 var(--ink)}
.agd{display:flex;flex-direction:column;align-items:center;line-height:1.2;padding-top:2px}
.agd b{font-size:16px;font-weight:800}
.agd span{font-size:12px;color:var(--muted);font-weight:600}
.agd.sun b,.agd.sun span{color:var(--warn)}
.agd.sat b,.agd.sat span{color:var(--accent)}
.agb{display:flex;flex-direction:column;gap:6px;min-width:0}
.agc{display:flex;flex-wrap:wrap;gap:5px}
.age{font-size:14px;font-weight:600}
.age .m{color:var(--muted);font-size:13px;font-weight:500}
.ago{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13.5px;color:var(--ink2)}
.ago b{font-weight:700;color:var(--muted)}
.ag .pl{font-size:13px;color:var(--muted)}

/* ===== duty/assign: toolbar + day bar ===== */
.dtool{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:4px 22px 16px}
.dtool .sp{flex:1}
.dtool .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.gpal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gbt{border:0;background:color-mix(in srgb,var(--g,var(--muted)) var(--mix),transparent);color:var(--g,var(--muted));border-radius:10px;padding:6px 14px;min-height:36px;font-weight:800;font-size:14px;cursor:pointer}
.gbt.on{background:var(--g,var(--muted));color:var(--surface)}
.daybar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 22px;border-top:1px solid var(--line);background:var(--sunk)}
.daybar .dt{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;letter-spacing:-.02em;min-width:170px}
.daybar .ppl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.daybar details{flex-basis:100%}
.daybar summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:4px}
.daybar summary::-webkit-details-marker{display:none}
.daybar .more{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.addp{display:inline-flex;gap:4px;align-items:center}
.addp input[type=text]{width:110px;min-width:0;min-height:34px;padding:4px 10px}
.addp input[type=date]{min-height:34px;padding:3px 10px}
.autop{border-top:1px solid var(--line);padding:18px 22px;display:grid;gap:14px;background:linear-gradient(180deg,var(--accent-soft),transparent)}
.autop h3{margin:0;font-size:16px;font-weight:800}
.autop .row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.autop .row>b{font-size:13px;color:var(--muted);min-width:72px}
.muted{color:var(--faint);font-size:13px}
.note-warn{font-size:13px;color:var(--warn);font-weight:600}
.vtabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 22px 16px}
table.roster{border-top:1px solid var(--line)}
table.roster th{width:120px;vertical-align:middle;padding:14px 22px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.roster th small{display:block;color:var(--muted);font-weight:600;margin-top:2px}
table.roster td{background:transparent!important;padding:12px 22px 12px 0}
table.roster tr:hover td{background:transparent}
.ed-v{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.hint b{color:var(--ink)}

/* edu/ops side editor */
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.rside{position:sticky;top:84px}
.ed{padding:4px 22px 22px;display:flex;flex-direction:column;gap:16px}
.ed-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ed-hd b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.ed-row{display:flex;flex-direction:column;gap:6px}
.ed-l{font-size:13px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ed-l small{font-weight:500}
.ed textarea{width:100%;min-height:96px;resize:vertical;line-height:1.55}

/* ===== org ===== */
.seats{display:grid;grid-template-columns:repeat(10,minmax(64px,1fr));gap:6px;min-width:700px;padding:4px 22px 22px}
.seat{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);text-align:center;padding:9px 4px;font-size:13.5px;font-weight:700;min-height:42px;display:flex;align-items:center;justify-content:center;gap:2px;position:relative}
.seat.empty{border:1px dashed var(--line);background:transparent}
.seat.thing{background:var(--sunk);color:var(--faint);font-weight:600;border-style:dashed}
.seat.lab{border:0;background:var(--head);color:var(--muted);font-size:12px}
.seat .grip{position:absolute;left:1px;top:50%;transform:translateY(-50%);width:16px;height:22px;font-size:11px}
.seat [contenteditable]{min-width:2.5em;padding:0 3px}
.heads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;padding:4px 22px 22px}
.hbox{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--sunk)}
.hbox small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.hbox b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px;padding:4px 22px 22px}
.tcard{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tcard h3{margin:0;padding:11px 14px;font-size:14.5px;font-weight:800;background:var(--sunk);display:flex;justify-content:space-between}
.tcard h3 small{color:var(--muted);font-weight:600}
.tcard ul{list-style:none;margin:0;padding:6px 0}
.tcard li{display:flex;justify-content:space-between;gap:8px;padding:5px 14px;font-size:14px;font-weight:600;color:var(--ink2)}
.tcard li span{color:var(--faint);font-size:12.5px;font-weight:500}
.tcard li.lead{color:var(--ink);font-weight:800}
.calc-box{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;background:var(--accent-soft);color:var(--ink);padding:16px 22px;margin:0 0 4px}
.calc-box .it{display:flex;flex-direction:column;font-size:13px;color:var(--muted);font-weight:600}
.calc-box .it b{font-size:17px;color:var(--accent);font-weight:800}
mark{background:color-mix(in srgb,var(--hl) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty-state{padding:56px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r)}
.foot{color:var(--faint);font-size:12.5px;padding-block:8px 30px;border-top:1px solid var(--line);margin-top:10px}

/* ===== drag & drop ===== */
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important}
.drag-src{opacity:.4}
.dnd-ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;box-shadow:var(--shadow-lg);border-radius:10px;opacity:.96;max-width:320px;background:var(--surface)}
.dnd-ghost.row{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--accent);font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop-ok{outline:2px dashed var(--accent)!important;outline-offset:-3px;background:var(--accent-soft)!important}
.drop-before>td,.drop-before>th{box-shadow:inset 0 3px 0 var(--accent)}
.drop-after>td,.drop-after>th{box-shadow:inset 0 -3px 0 var(--accent)}
section.drop-before{box-shadow:0 -4px 0 var(--accent)}
section.drop-after{box-shadow:0 4px 0 var(--accent)}
.trash{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line-strong);border-radius:10px;padding:6px 12px;color:var(--faint);font-size:13px;font-weight:600}
.trash.drop-ok{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)!important;outline-color:var(--warn)!important}

@media (max-width:1100px){.rgrid{grid-template-columns:1fr}.rside{position:static;order:-1}}
@media (max-width:900px){
  .hdr-in{flex-wrap:wrap;padding-block:8px 0;min-height:0}
  .nav{order:3;flex-basis:100%;padding-bottom:6px}
  .hdr-r{margin-left:auto}
  .switch .t{display:none}
  .hdr{position:static}
  table.kv,table.kv tbody,table.kv tr{display:block}
  table.kv tr{border-bottom:1px solid var(--line)}
  table.kv tr:last-child{border-bottom:0}
  table.kv th{width:auto;display:block;border:0;padding:14px 18px 2px}
  table.kv td{display:block;border:0;padding:4px 18px 14px}
}
@media (max-width:760px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero h1{font-size:26px}
  .hero-in{padding-block:24px 0}
  .card-hd{padding:16px 18px 12px}
  .card-bd,.dtool,.vtabs,.quick,.heads,.tgrid{padding-left:18px;padding-right:18px}
  .daybar{padding:14px 18px}
  .calgrid{display:none}
  .agenda{display:block}
  .week{grid-template-columns:1fr;padding:4px 18px 18px;gap:6px}
  .wday{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}
  .wday .d{min-width:5.5em}
  table.stk thead{display:none}
  table.stk,table.stk tbody{display:block}
  table.stk tr{display:block;padding:12px 18px;border-top:1px solid var(--line)}
  table.stk tr.tier{border-top:2px solid var(--line-strong)}
  table.stk td{display:flex;align-items:baseline;flex-wrap:nowrap;padding:3px 0;border:0;background:none!important;text-align:left;white-space:pre-wrap;min-width:0}
  table.stk td::before{content:attr(data-l);flex:0 0 6.4em;margin-right:10px;color:var(--faint);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.stk td.ph{display:none}
  table.stk td .chip{flex:none}
  table.stk td:first-child{font-weight:700;color:var(--ink)}
  table.stk td.cont{color:inherit}
  table.stk td:empty{display:none}
  table.stk td.empty-cell,table.stk td.hd,table.stk td.act{display:block;text-align:left}
  table.stk td.empty-cell{text-align:center}
  table.stk td.empty-cell::before,table.stk td.hd::before,table.stk td.act::before{content:none}
  table.stk td.hd{float:right;width:auto}
  table.stk td.lg{min-width:0}
  .tw table:not(.stk) td,.tw table:not(.stk) th{padding-left:8px;padding-right:8px}
  .seats{grid-template-columns:repeat(10,minmax(0,1fr));min-width:0;gap:3px;padding:4px 10px 16px}
  .seat{font-size:10.5px;padding:6px 0;letter-spacing:-.05em;white-space:nowrap;overflow:hidden;min-height:32px;border-radius:7px}
  .seat.lab{font-size:9.5px}
  .stat .val{font-size:28px}
  .gtools .lbl{display:none}
  #savebar .k{display:none}
  .gpal .trash{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v8: 홈페이지형 정리. 흰 바탕 · 얇은 선 · 장식 최소화 · 달력은 일반 월간 달력 ===== */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunk:#f7f8fa; --head:#f1f3f5; --ink:#0b0d12; --ink2:#2b2f37; --muted:#6b717b; --faint:#a4a9b1; --line:#eceef1; --line-strong:#dfe2e7;
  --accent:#2357e5; --accent-ink:#fff; --accent-soft:#eff4ff; --accent-line:#c9d7fb;
  --com:#2b2f37; --com-soft:#f3f4f6; --com-line:#dfe2e7; --hero:#fff; --hero-c:#fff;
  --red:#d93025; --blue:#1a73e8;
  --gA:#e37400; --gB:#1a73e8; --gC:#8430ce; --gD:#188038; --gE:#d01884;
  --shadow:none; --shadow-lg:0 18px 48px rgba(12,16,24,.16),0 2px 8px rgba(12,16,24,.06);
  --r:14px; --wrap:1200px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0d10; --surface:#121418; --sunk:#171a1f; --head:#1d2026; --ink:#f2f3f5; --ink2:#d3d6db; --muted:#9097a1; --faint:#646a73; --line:#22262c; --line-strong:#2e333b;
  --accent:#7ea4ff; --accent-ink:#0b1430; --accent-soft:#18213a; --accent-line:#2f4277;
  --com:#d3d6db; --com-soft:#1d2026; --com-line:#2e333b; --hero:#121418; --hero-c:#121418;
  --red:#f28b82; --blue:#8ab4f8;
  --gA:#b85c00; --gB:#1967d2; --gC:#7627bb; --gD:#137333; --gE:#b80672; --shadow-lg:0 18px 48px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{
  --bg:#0c0d10; --surface:#121418; --sunk:#171a1f; --head:#1d2026; --ink:#f2f3f5; --ink2:#d3d6db; --muted:#9097a1; --faint:#646a73; --line:#22262c; --line-strong:#2e333b;
  --accent:#7ea4ff; --accent-ink:#0b1430; --accent-soft:#18213a; --accent-line:#2f4277;
  --com:#d3d6db; --com-soft:#1d2026; --com-line:#2e333b; --hero:#121418; --hero-c:#121418;
  --red:#f28b82; --blue:#8ab4f8;
  --gA:#b85c00; --gB:#1967d2; --gC:#7627bb; --gD:#137333; --gE:#b80672; --shadow-lg:0 18px 48px rgba(0,0,0,.6)}
body{background:var(--bg);font-size:15px;letter-spacing:-.016em}
main{padding-block:36px 120px}
/* header */
.hdr{background:color-mix(in srgb,var(--surface) 92%,transparent)}
.hdr-in{min-height:68px;gap:8px 22px}
.logo .mk{border-radius:8px;width:30px;height:30px;font-size:10.5px}
.logo b{font-size:17px;font-weight:700;letter-spacing:-.04em}
.nav{align-self:stretch;gap:0}
.nav button{height:100%;padding:0 12px;border-radius:0;background:none!important;font-weight:500;font-size:15px;color:var(--muted);position:relative}
.nav button:hover{color:var(--ink)}
.nav button[aria-current=true]{color:var(--ink);font-weight:700}
.nav button[aria-current=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--ink)}
.nav .lab{color:var(--faint);font-weight:600;font-size:12px}
.nav .sep{background:var(--line-strong);margin:0 10px}
.mpill{border-color:var(--line)}
.mpill select{font-weight:600}
.switch{border-color:var(--line);font-weight:600}
.compill{background:var(--sunk);color:var(--ink2);font-weight:600}
/* page head */
.hero,.c-page .hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{padding-block:52px 0}
.kicker,.c-page .kicker{color:var(--muted);font-weight:600;font-size:13.5px;margin-bottom:10px}
.kicker svg.i{width:16px;height:16px}
.hero h1{font-size:40px;font-weight:700;letter-spacing:-.05em;line-height:1.2}
.hero p{font-size:16px;margin-top:12px;color:var(--muted)}
.subtabs{gap:30px;padding:34px 0 0;margin-bottom:-1px}
.subtabs button{padding:0 0 14px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none!important;font-weight:500;font-size:15px;color:var(--muted)}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.subtabs .n{font-weight:500}
.hero-sp{height:44px}
.combar{color:var(--muted)}
/* surfaces */
.card{box-shadow:none;border-color:var(--line)}
.card-hd{padding:22px 24px 16px}
.card-hd h2{font-size:18px;font-weight:700;letter-spacing:-.04em}
.btn{font-weight:600;border-color:var(--line-strong)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
thead th{background:transparent;color:var(--muted);font-weight:600;border-top:0}
.chip{font-weight:600;background:var(--sunk);color:var(--ink2)}
.chip[class*="g-"]{background:var(--sunk);color:var(--ink2)}
.chip[class*="g-"]::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--g);flex:none}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.quick button:hover{border-color:var(--line-strong);background:var(--sunk)}
.quick .qi{background:var(--sunk);color:var(--ink2)}
.quick b{font-weight:700}
/* today */
.today-hero{gap:0;padding:0;border:1px solid var(--line);border-radius:var(--r);margin:30px 0 40px;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden}
.stat{border:0;border-radius:0;box-shadow:none;border-right:1px solid var(--line);padding:22px 22px 16px}
.stat:last-child{border-right:0}
.stat::before{display:none}
.stat .lab{font-weight:600}
.stat .val{color:var(--ink);font-size:30px;font-weight:700;display:flex;align-items:center;gap:10px}
.stat[class*="g-"] .val::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--g);flex:none}
.stat .val.txt{font-size:16px;font-weight:600}
.daynav .btn{min-height:36px}
.week{gap:0;padding:0;border-top:1px solid var(--line)}
.wday{border:0;border-right:1px solid var(--line);border-radius:0;min-height:132px;padding:10px 8px 12px;gap:4px;background:var(--surface)}
.wday:last-child{border-right:0}
.wday:hover{background:var(--sunk);border-color:var(--line)}
.wday.sel{box-shadow:none;background:var(--accent-soft);border-color:var(--line)}
.wd-h{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.wd-w{font-size:12px;font-weight:600;color:var(--muted)}
.wday.today .mc-n{background:var(--accent);color:var(--accent-ink)!important}
.red{color:var(--red)!important}.blue{color:var(--blue)!important}
/* month calendar */
.mc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-bottom:20px}
.mc-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px}
.mc-t{display:flex;align-items:center;gap:4px}
.mc-t h2{margin:0 10px 0 0;font-size:24px;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums;min-width:128px}
.mc-t .btn{margin-left:8px}
.mc-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mc-cnt{font-size:13px;color:var(--muted)}
.mc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.mc-wd{padding:9px 10px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.mc-wd:nth-child(7){border-right:0}
.mc-wd.sun{color:var(--red)}.mc-wd.sat{color:var(--blue)}
.mc-c{min-height:128px;padding:6px 6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;transition:background .12s;outline-offset:-2px}
.mc-c:nth-child(7n){border-right:0}
.mc-grid>.mc-c:nth-last-child(-n+7){border-bottom:0}
.mc-c:hover{background:var(--sunk)}
.mc-c.sel{background:var(--accent-soft)}
.mc-c.off{cursor:default;background:var(--sunk)}
.mc-c.na{cursor:default;background:color-mix(in srgb,var(--sunk) 55%,var(--surface))}
.mc-c.off .mc-n,.mc-c.na .mc-n{color:var(--faint)!important}
.mc-c.out .mc-n{color:var(--faint)}
.mc-c.out .ev,.mc-c.out .ev-ppl,.mc-c.out .ev-ops{opacity:.6}
.mc-dh{display:flex;align-items:center;gap:6px;min-width:0;height:26px}
.mc-n{font-size:13px;font-weight:600;min-width:26px;height:26px;display:inline-grid;place-items:center;border-radius:13px;padding:0 6px;color:var(--ink2);flex:none;font-variant-numeric:tabular-nums}
.mc-c.today .mc-n{background:var(--accent);color:var(--accent-ink)!important}
.mc-memo{font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev{display:block;border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:600;line-height:1.4;color:#fff;background:var(--g,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.ev.plain{background:var(--head);color:var(--ink2)}
.ev.dot{background:none;color:var(--ink2);font-weight:500;padding:1px 4px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4;font-size:12px;position:relative;padding-left:15px}
.ev.dot::before{content:"";position:absolute;left:4px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ev.dot em{margin-right:5px}
.ev.dot em{font-style:normal;color:var(--muted);font-weight:600}
.ev[data-drag],.ev-ops[data-drag]{cursor:grab}
.ev-mk{font-style:normal;font-size:10.5px;font-weight:500;opacity:.9;margin-left:6px}
.ev-ppl{font-size:11.5px;color:var(--muted);line-height:1.5;padding:0 3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.ev-ops{display:flex;flex-direction:column;gap:1px}
.ev-line{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.ev-line b{font-weight:600;color:var(--muted);margin-right:5px;font-variant-numeric:tabular-nums}
.ev-dotm{display:none}
.ev-more{font-size:11.5px;color:var(--muted);padding:0 4px}
.ev-empty{color:var(--faint);font-size:12px;padding:2px 4px;opacity:0;transition:opacity .12s}
.mc-c:hover .ev-empty,.mc-c:focus .ev-empty{opacity:1}
.mc-c.drop-ok{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
/* day popover */
#pop{position:absolute;z-index:70;width:330px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:12px 16px 16px}
#pop.sheet{position:fixed;left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-width:none;border-radius:18px 18px 0 0;max-height:74vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.pp-hd{display:flex;align-items:center;gap:2px;margin:0 -8px 8px}
.pp-hd b{font-size:16px;font-weight:700;letter-spacing:-.035em;padding:0 4px}
.pp-hd .sp{flex:1}
.pp-memo{font-size:13px;font-weight:600;color:var(--muted);margin:-4px 0 10px}
.pp-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ev.big{display:inline-block;font-size:15px;padding:6px 14px;border-radius:8px}
.pp-empty{margin:0 0 12px;color:var(--muted);font-size:14px}
.pp-ppl{display:flex;flex-wrap:wrap;gap:6px}
.pn{display:inline-flex;align-items:center;gap:2px;padding:4px 11px;border-radius:999px;background:var(--sunk);font-size:13.5px;font-weight:600;color:var(--ink2)}
.pn .px{margin-right:-6px}
.pp-sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.pp-sec.first{border-top:0;padding-top:0;margin-top:4px}
.pp-l{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.pp-l small{font-weight:500;color:var(--faint);font-size:11.5px}
.pp-gs{display:flex;flex-wrap:wrap;gap:6px}
.gb{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:5px 11px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.gb:hover{border-color:var(--ink2)}
.gb[class*="g-"]::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--g)}
.gb.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.gb[class*="g-"].on{background:var(--g);border-color:var(--g);color:#fff}
.gb.on::before{background:#fff!important}
.gb.ghost{border-style:dashed;color:var(--muted)}
.pp-add{display:flex;gap:6px;margin-top:10px}
.pp-add input{flex:1;min-width:0}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0;margin-top:10px;cursor:pointer}
.pp-foot{margin-top:14px;display:flex;justify-content:flex-end}
.pp-list{display:flex;flex-direction:column;gap:10px}
.pp-it{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.pp-it small{flex-basis:100%;color:var(--muted);font-size:13px}
.pp-shift{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.pp-shift b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
#pop textarea.in{width:100%;min-height:110px;resize:vertical;line-height:1.55}
#pop textarea.in.sm{min-height:48px}
/* random dialog */
.ovl{position:fixed;inset:0;z-index:90;background:rgba(10,12,16,.4);display:grid;place-items:center;padding:20px}
.dlg{background:var(--surface);border-radius:20px;max-width:460px;width:100%;padding:28px 28px 22px;box-shadow:var(--shadow-lg)}
.dlg h3{margin:0 0 12px;font-size:21px;font-weight:700;letter-spacing:-.045em}
.dlg p{margin:0 0 10px;color:var(--ink2);font-size:15px;line-height:1.7}
.dlg .dlg-s{color:var(--muted);font-size:13.5px;margin-bottom:24px}
.dlg-b{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:900px){
  .today-hero{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:760px){
  .hero-in{padding-block:30px 0}
  .hero h1{font-size:28px}
  .hero p{font-size:14.5px}
  .subtabs{gap:22px;padding-top:24px}
  .subtabs button{font-size:14.5px;padding-bottom:12px}
  .hero-sp{height:28px}
  main{padding-block:20px 120px}
  .nav button{font-size:14.5px;padding:0 10px}
  .mc{border-radius:12px;margin-inline:-4px}
  .mc-bar{padding:12px 12px}
  .mc-t h2{font-size:19px;min-width:0;margin-right:4px}
  .mc-r .mc-cnt:first-child{display:none}
  .mc-wd{padding:6px 2px;text-align:center}
  .mc-c{min-height:72px;padding:3px 2px 4px;gap:2px}
  .mc-dh{justify-content:center;height:24px}
  .mc-n{font-size:12px;min-width:22px;height:22px;padding:0 4px}
  .mc-memo,.ev-ppl,.ev-line,.ev-mk,.ev-empty,.ev.dot em{display:none}
  .ev{font-size:10.5px;padding:2px 2px;border-radius:4px;text-align:center;font-weight:700}
  .ev.dot{font-size:10px;padding:0 0 0 8px;-webkit-line-clamp:1;text-align:left}
  .ev.dot::before{width:5px;height:5px;left:1px;top:5px}
  .ev-ops{align-items:center}
  .ev-dotm{display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);background:var(--head);border-radius:4px;padding:0 5px}
  .ev-more{font-size:10px;text-align:center}
  .today-hero{margin:20px 0 28px}
  .stat{padding:16px}
  .stat .val{font-size:24px}
  .week{grid-template-columns:repeat(7,minmax(0,1fr))}
  .wday{min-height:96px;padding:6px 3px;align-items:center}
  .wday .mc-memo{display:none}
  .wd-h{flex-direction:column;gap:0}
  .wday .ev{font-size:10px;padding:2px 1px}
  .wday .ev{width:100%}
  .dlg{padding:22px 20px 18px}
  .dlg-b .btn{flex:1 1 auto}
}

/* 조 설정 (달력 아래) */
.rs{border-top:1px solid var(--line)}
.rs-v{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--sunk)}
.rs-v .rs-vl{font-size:12.5px;font-weight:600;color:var(--muted);margin-right:4px}
.rs-v .sp{flex:1}
.rs-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 20px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line)}
.rs-row:last-child{border-bottom:0}
.rs-g{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.rs-g .ev{font-size:13.5px;padding:4px 12px}
.rs-g small{font-size:12px;color:var(--muted)}
.rs-m{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-height:34px;border-radius:10px}
.rs-n{font-size:14.5px;font-weight:600;color:var(--ink2);margin-right:6px}
.rs-m .addp input{width:110px}
.rs-m.drop-ok{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
@media (max-width:760px){.rs-row{grid-template-columns:1fr;padding:12px 16px}.rs-g{flex-direction:row;align-items:center;gap:10px}.rs-v{padding:10px 16px}}

/* ===== v10: 시스템형 레이아웃. 왼쪽 메뉴(이번 달 / 자료실) · 얇은 상단 바 · 낮은 페이지 머리 · 장식 없는 카드와 표 ===== */
:root{--bg:#f4f5f7;--sunk:#f6f7f9;--head:#eef0f3;--line:#e5e7eb;--line-strong:#d4d8de;--th:#f7f8fa;--rowh:#fafbfc;--com:#0b7a6c;--com-soft:#e7f5f2;--sbw:244px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0c0f;--th:#171a1f;--rowh:#15181c;--line:#252930;--line-strong:#333840;--com:#4fd1bd;--com-soft:#10302b}}
:root[data-theme="dark"]{--bg:#0b0c0f;--th:#171a1f;--rowh:#15181c;--line:#252930;--line-strong:#333840;--com:#4fd1bd;--com-soft:#10302b}
body{background:var(--bg);word-break:keep-all;margin:0}
/* sidebar */
.sb{position:fixed;top:0;left:0;bottom:0;width:var(--sbw);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:45;overflow-y:auto}
.sb .logo{display:flex;align-items:center;gap:10px;padding:18px 20px 16px;border:0;background:none;cursor:pointer;text-align:left}
.sb .logo .mk{width:30px;height:30px;border-radius:8px;font-size:10.5px}
.sb .logo b{font-size:16px;font-weight:700;letter-spacing:-.035em}
.sb-month{padding:0 12px 6px}
.sb-month .lab{display:block;font-size:11.5px;font-weight:600;color:var(--faint);padding:0 6px 6px}
.sb .mpill{display:flex;width:100%;border-radius:10px;border:1px solid var(--line);padding:3px;background:var(--sunk)}
.sb .mpill select{flex:1;max-width:none;text-align:center;font-size:14px;font-weight:700}
.sb .nav{display:block;overflow:visible;height:auto;flex:none;padding:0 10px 24px;margin:0;border:0;align-self:auto}
.sb .nav .grp{display:flex;align-items:baseline;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);padding:18px 10px 6px;letter-spacing:.01em}
.sb .nav .grp small{font-size:11px;font-weight:500;color:var(--faint)}
.sb .nav .grp.c{border-top:1px solid var(--line);margin-top:12px;padding-top:16px}
.sb .nav button{display:flex;width:100%;height:auto;align-items:center;gap:10px;padding:8px 10px;margin:1px 0;border-radius:8px;font-size:14.5px;font-weight:500;color:var(--ink2);text-align:left;background:none!important}
.sb .nav button svg.i{width:17px;height:17px;color:var(--faint)}
.sb .nav button:hover{background:var(--sunk)!important;color:var(--ink)}
.sb .nav button[aria-current=true]{background:var(--accent-soft)!important;color:var(--accent);font-weight:700}
.sb .nav button[aria-current=true] svg.i{color:var(--accent)}
.sb .nav button.c[aria-current=true]{background:var(--com-soft)!important;color:var(--com)}
.sb .nav button.c[aria-current=true] svg.i{color:var(--com)}
.sb .nav button::after{display:none!important}
.sb-scrim{display:none}
.shell{margin-left:var(--sbw);min-width:0}
/* top bar */
.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;height:56px;min-height:0;padding:0 28px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:700}
.crumb .sl{color:var(--line-strong)}
.crumb .tag{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.crumb .tag.c{background:var(--com-soft);color:var(--com)}
.hdr .hdr-r{margin-left:auto}
#menuBtn{display:none}
.compill{display:none!important}
/* page head */
.shell .wrap{max-width:1320px;margin:0;padding-left:28px;padding-right:28px}
.hero,.c-page .hero{background:var(--surface);border-top:0;border-bottom:1px solid var(--line)}
.hero-in{padding-block:22px 0}
.kicker{display:none!important}
.hero h1{font-size:23px;font-weight:700;letter-spacing:-.04em;line-height:1.3}
.hero p{font-size:13.5px;margin-top:4px;color:var(--muted)}
.hero-row{align-items:center}
.subtabs{gap:26px;padding:16px 0 0;margin-bottom:-1px}
.subtabs button{font-size:14.5px;padding-bottom:12px}
.subtabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.hero-sp{height:20px}
main{padding-block:22px 120px}
.today-hero{margin:18px 0 24px}
/* cards and tables: no decoration */
.card,.mc{border-radius:10px;box-shadow:none;border:1px solid var(--line);margin-bottom:16px}
.card-hd{padding:14px 18px 12px;border-bottom:1px solid var(--line);gap:2px 12px}
.card-hd h2{font-size:15.5px;font-weight:700;letter-spacing:-.03em}
.card-hd .sub{font-size:12.5px}
.flow,.grid2{gap:0 16px}
table{font-size:14px}
thead th{background:var(--th);color:var(--muted);font-weight:600;font-size:12.5px;padding:9px 14px;border-top:0;border-bottom:1px solid var(--line)}
tbody td{padding:10px 14px;color:var(--ink)}
tbody tr:hover td{background:var(--rowh)}
table.kv th{width:210px;background:var(--rowh);color:var(--ink2);font-weight:600;font-size:13.5px;padding:12px 18px;border-right:1px solid var(--line);word-break:keep-all}
table.kv td{padding:12px 18px}
.chip{font-weight:600}
.toc{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin:0 0 14px;padding:0}
.toc>span{font-size:12.5px;font-weight:600;color:var(--faint);margin-right:6px}
.toc button{border:0;background:none;padding:4px 8px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.toc button:hover{background:var(--surface);color:var(--ink)}
.toc button+button::before{content:"·";color:var(--line-strong);margin-right:8px;margin-left:-6px}
.mc-bar{padding:14px 18px}
.mc-t h2{font-size:21px}
.rs-v{padding:10px 18px}
.rs-row{padding:12px 18px}
.quick button{border-radius:10px}
@media (max-width:1180px){
  thead th{padding:9px 10px}
  tbody td{padding:10px 10px}
}
@media (max-width:1100px){
  .sb{transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  body.sb-open .sb{transform:none}
  body.sb-open .sb-scrim{display:block;position:fixed;inset:0;background:rgba(10,12,16,.35);z-index:44}
  .shell{margin-left:0}
  #menuBtn{display:inline-grid}
  .hdr{position:sticky;padding:0 12px;height:54px}
}
@media (max-width:900px){
  .shell .wrap{padding-left:16px;padding-right:16px}
  table.kv th{width:auto;border-right:0;background:transparent;padding:14px 18px 2px}
  table.kv td{padding:4px 18px 14px}
  table{font-size:13.5px}
  thead th{padding:8px 7px}
  tbody td{padding:9px 7px}
  table.stk td,table.stk th{border-left:0}
  .toc{display:none}
}
@media (min-width:761px) and (max-width:900px){[id^=b-tuition] td:nth-child(3),[id^=b-tuition] td:nth-child(7){max-width:96px;font-size:12.5px}}
@media (max-width:760px){
  .crumb>span:not(.tag),.crumb .sl{display:none}
  .hero-in{padding-block:18px 0}
  .hero h1{font-size:21px}
  .card-hd{padding:12px 14px 10px}
}

/* ===== v11: 고급형 마감. 남색 사이드바 · 차가운 회색 바탕 · 인디고 한 가지 강조색 · 자료실은 청록 ===== */
:root{
  --sb-bg:#0f1a2e;--sb-bg2:#0b1424;--sb-ink:#e8edf7;--sb-txt:#b9c3d6;--sb-mut:#7f8ba3;--sb-line:rgba(255,255,255,.08);--sb-hi:rgba(255,255,255,.06);--sb-act:rgba(124,150,255,.17);--sb-bar:#8aa2ff;
  --bg:#f3f5f8;--surface:#ffffff;--sunk:#f7f8fa;--head:#eef1f5;--line:#e6e9ef;--line-strong:#d4d9e1;--th:#f8f9fb;--rowh:#f8fafc;
  --ink:#101828;--ink2:#344054;--muted:#667085;--faint:#98a2b3;
  --accent:#3454d1;--accent-ink:#fff;--accent-soft:#eef2ff;--accent-line:#c7d2fe;--pri:#16233b;
  --com:#0d8577;--com-soft:#e5f4f1;
  --sh1:0 1px 2px rgba(16,24,40,.05);--sh2:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 20px 48px -12px rgba(16,24,40,.22),0 4px 12px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sb-bg:#0a111e;--sb-bg2:#070c16;--bg:#0b0e13;--surface:#12161d;--sunk:#161b23;--head:#1b212b;--line:#222935;--line-strong:#2f3744;--th:#161b23;--rowh:#151a22;
  --ink:#eef1f6;--ink2:#cfd5df;--muted:#8f99aa;--faint:#5f6a7b;--accent:#8ea6ff;--accent-ink:#0b1430;--accent-soft:#1a2341;--accent-line:#34478a;--pri:#8ea6ff;--com:#4fd1bd;--com-soft:#0f2e2a;
  --sh1:none;--sh2:none;--shadow-lg:0 20px 48px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{
  --sb-bg:#0a111e;--sb-bg2:#070c16;--bg:#0b0e13;--surface:#12161d;--sunk:#161b23;--head:#1b212b;--line:#222935;--line-strong:#2f3744;--th:#161b23;--rowh:#151a22;
  --ink:#eef1f6;--ink2:#cfd5df;--muted:#8f99aa;--faint:#5f6a7b;--accent:#8ea6ff;--accent-ink:#0b1430;--accent-soft:#1a2341;--accent-line:#34478a;--pri:#8ea6ff;--com:#4fd1bd;--com-soft:#0f2e2a;
  --sh1:none;--sh2:none;--shadow-lg:0 20px 48px rgba(0,0,0,.6)}
body{font-size:14.5px;letter-spacing:-.012em;color:var(--ink)}
::selection{background:var(--accent-soft)}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* sidebar */
.sb{background:linear-gradient(180deg,var(--sb-bg) 0%,var(--sb-bg2) 100%);border-right:0;color:var(--sb-ink);scrollbar-color:rgba(255,255,255,.15) transparent}
.sb .logo{padding:20px 18px 18px;gap:12px}
.sb .logo .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#5873ff 0%,#2c46c8 100%);color:#fff;font-size:10.5px;letter-spacing:.04em;box-shadow:0 4px 12px -2px rgba(70,100,255,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.sb .logo .lt{display:flex;flex-direction:column;line-height:1.25}
.sb .logo b{color:#fff;font-size:15.5px;font-weight:700;letter-spacing:-.035em}
.sb .logo small{color:var(--sb-mut);font-size:11.5px;font-weight:500;letter-spacing:-.01em}
.sb-month{padding:2px 12px 8px}
.sb-month .lab{color:var(--sb-mut);font-weight:600;font-size:11.5px}
.sb .mpill{background:rgba(255,255,255,.05);border:1px solid var(--sb-line);border-radius:10px;padding:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.sb .mpill select{color:#fff;font-weight:650;font-size:13.5px}
.sb .mpill select option{color:#101828;background:#fff}
.sb .mpill .ib{color:var(--sb-mut);width:28px;height:28px;border-radius:7px}
.sb .mpill .ib:hover:not([disabled]){background:var(--sb-hi);color:#fff}
.sb .nav{padding:0 10px 18px}
.sb .nav .grp{color:var(--sb-mut);font-size:11.5px;font-weight:650;padding:20px 10px 8px}
.sb .nav .grp small{color:rgba(255,255,255,.3)}
.sb .nav .grp.c{border-top:1px solid var(--sb-line);margin-top:14px;padding-top:18px}
.sb .nav button{position:relative;color:var(--sb-txt);font-size:14px;font-weight:500;padding:8px 10px;border-radius:8px;transition:background .12s,color .12s}
.sb .nav button svg.i{color:#6f7d98;transition:color .12s}
.sb .nav button:hover{background:var(--sb-hi)!important;color:#fff}
.sb .nav button:hover svg.i{color:#c9d2e4}
.sb .nav button[aria-current=true]{background:var(--sb-act)!important;color:#fff;font-weight:650}
.sb .nav button[aria-current=true] svg.i{color:var(--sb-bar)}
.sb .nav button[aria-current=true]::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--sb-bar)}
.sb .nav button.c[aria-current=true]{background:rgba(79,209,189,.13)!important;color:#fff}
.sb .nav button.c[aria-current=true] svg.i{color:#5fe0cb}
.sb .nav button.c[aria-current=true]::before{background:#5fe0cb}
.sb-foot{margin-top:auto;padding:14px 20px 18px;border-top:1px solid var(--sb-line);font-size:12px;color:var(--sb-mut);display:flex;flex-direction:column;gap:3px}
.sb-foot .st{display:flex;align-items:center;gap:8px;color:var(--sb-txt);font-weight:600;font-size:12.5px}
.sb-foot .st i{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.sb-foot .st.warn i{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.18)}

/* top bar */
.hdr{height:58px;padding:0 28px;background:color-mix(in srgb,var(--surface) 88%,transparent);border-bottom:1px solid var(--line)}
.crumb{font-size:13px}
.crumb .tag{font-size:11.5px;font-weight:650;border-radius:6px;padding:3px 8px;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}
.crumb .tag.c{background:var(--com-soft);color:var(--com);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--com) 30%,transparent)}
.crumb b{font-weight:650}
.dchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.dchip svg.i{width:14px;height:14px}
.switch{border:1px solid var(--line-strong);background:var(--surface);box-shadow:var(--sh1);font-weight:600;font-size:12.5px;min-height:32px}
.switch[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent-line)}
.hdr .ib{width:34px;height:34px;border-radius:8px}

/* page head */
.hero-in{padding-block:24px 0}
.hero h1{font-size:24px;font-weight:700;letter-spacing:-.045em}
.hero p{font-size:13.5px;color:var(--muted);margin-top:5px}
.subtabs{gap:28px;padding-top:18px}
.subtabs button{font-size:14px;font-weight:500;color:var(--muted);padding-bottom:13px;transition:color .12s}
.subtabs button[aria-selected=true]{color:var(--ink);font-weight:650;border-bottom-color:var(--accent)}
.c-page .subtabs button[aria-selected=true]{border-bottom-color:var(--com)}
.subtabs .n{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--head);color:var(--muted);font-size:11px;font-weight:650;opacity:1}
.subtabs button[aria-selected=true] .n{background:var(--accent-soft);color:var(--accent)}
.c-page .subtabs button[aria-selected=true] .n{background:var(--com-soft);color:var(--com)}
main{padding-block:24px 120px}

/* surfaces */
.card,.mc{border-radius:12px;border:1px solid var(--line);box-shadow:var(--sh1);background:var(--surface)}
.card-hd{padding:16px 20px 14px;border-bottom:1px solid var(--line)}
.card-hd h2{font-size:15px;font-weight:650;letter-spacing:-.03em}
.card-hd .sub{font-size:12.5px;color:var(--muted)}
.card-hd .right .chip{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-weight:600;font-size:12px}
.btn{border-radius:8px;min-height:36px;padding:6px 13px;font-size:13.5px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink2);box-shadow:var(--sh1);transition:background .12s,border-color .12s,color .12s}
.btn:hover:not([disabled]){background:var(--sunk);border-color:var(--line-strong);color:var(--ink)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.12),inset 0 1px 0 rgba(255,255,255,.08)}
.btn.primary:hover:not([disabled]){background:var(--pri);color:#fff;opacity:.92}
input[type=date],input[type=month],input[type=text],input[type=search],select.in,textarea.in{border-radius:8px;border:1px solid var(--line-strong);box-shadow:var(--sh1);font-size:13.5px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* tables */
table{font-size:14px}
thead th{background:var(--th);color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0;padding:10px 16px;border-bottom:1px solid var(--line)}
tbody td{padding:11px 16px;color:var(--ink2);border-bottom:1px solid var(--line)}
tbody td:first-child{color:var(--ink)}
tbody tr:hover td{background:var(--rowh)}
td.num{font-variant-numeric:tabular-nums;color:var(--ink)}
table.kv th{background:var(--th);color:var(--ink);font-weight:600;font-size:13.5px;border-right:1px solid var(--line);padding:13px 20px}
table.kv td{padding:13px 20px}

/* calendar */
.mc-bar{padding:16px 20px}
.mc-t h2{font-size:20px;font-weight:700;letter-spacing:-.045em}
.mc-t .ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh1)}
.mc-wd{background:var(--th);font-size:11.5px;padding:8px 10px}
.mc-c{transition:background .1s}
.mc-c.today{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.mc-c.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.mc-n{font-weight:600}
.ev{border-radius:5px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
.ev.plain{box-shadow:inset 0 0 0 1px var(--line)}
.ev.dot{box-shadow:none}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.ev-ppl{color:var(--muted)}

/* today */
.today-hero{border-radius:12px;box-shadow:var(--sh1)}
.stat .lab{font-size:12.5px;color:var(--muted)}
.stat .val{font-size:28px;letter-spacing:-.04em}
.stat .go{font-size:12.5px;color:var(--muted)}
.wday{transition:background .1s}
.quick button{border-radius:10px;box-shadow:var(--sh1);transition:border-color .12s,background .12s}
.quick button:hover{border-color:var(--accent-line);background:var(--surface)}
.quick .qi{border-radius:10px;background:var(--accent-soft);color:var(--accent)}

/* group settings */
.rs-row{padding:13px 20px}
.rs-n{font-weight:600;color:var(--ink)}

/* floating */
#pop{border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.dlg{border-radius:16px;box-shadow:var(--shadow-lg)}
.ovl{background:rgba(10,16,30,.45);backdrop-filter:blur(2px)}
#savebar .in{background:var(--sb-bg);color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:14px;box-shadow:0 18px 40px -10px rgba(10,16,30,.5)}
#savebar .t{color:#fff;font-weight:600}
#savebar .ib{color:#b9c3d6}
#savebar .ib:hover:not([disabled]){background:rgba(255,255,255,.08)}
#savebar .btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#fff;box-shadow:none}
#savebar .btn:hover{background:rgba(255,255,255,.12);color:#fff}
#savebar .btn.primary{background:#4c6bff;border-color:#4c6bff}
#toast{background:var(--sb-bg);color:#fff;border-radius:10px;font-size:13.5px;box-shadow:0 12px 30px -8px rgba(10,16,30,.45)}
@media (max-width:1100px){.dchip{display:none}.hdr{padding:0 12px}}
@media (max-width:760px){.hero h1{font-size:21px}.card-hd{padding:13px 14px 11px}thead th{padding:8px 7px}tbody td{padding:9px 7px}}
@media (prefers-reduced-motion:reduce){.sb{transition:none}}
[id^=b-tuition] thead th,[id^=b-tuition] tbody td{padding-left:10px;padding-right:10px}
@media (max-width:1180px){thead th{padding:10px 10px}tbody td{padding:11px 10px}}
@media (max-width:900px){table{font-size:13px}thead th{padding:8px 6px}tbody td{padding:9px 6px}}

/* ===== v12: 사이트형 상단 메뉴 (사이드바 없음). 남색 윗줄 = 지점·달·편집, 흰 아랫줄 = 메뉴(이번 달 | 자료실) ===== */
.shell{margin-left:0!important}
.shell .wrap,.top .wrap{max-width:1240px;margin:0 auto;padding-left:28px;padding-right:28px}
.top{position:sticky;top:-60px;z-index:40}
.top1{background:linear-gradient(180deg,#14223c 0%,#0f1a2e 100%);color:#fff}
.t1{display:flex;align-items:center;gap:16px;height:60px}
.top .logo{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;cursor:pointer;text-align:left;flex:none}
.top .logo .mk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,#5873ff 0%,#2c46c8 100%);color:#fff;font-weight:800;font-size:10.5px;letter-spacing:.04em;box-shadow:0 4px 12px -2px rgba(70,100,255,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.top .logo .lt{display:flex;flex-direction:column;line-height:1.25}
.top .logo b{color:#fff;font-size:16px;font-weight:700;letter-spacing:-.035em}
.top .logo small{color:#8c99b3;font-size:11.5px;font-weight:500}
.top .hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.top .mpill{display:flex;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:2px}
.top .mpill select{color:#fff;font-weight:650;font-size:13.5px;border:0;background:none;padding:4px 2px;max-width:160px;cursor:pointer}
.top .mpill select option{color:#101828;background:#fff}
.top .ib{color:#b9c3d6;width:32px;height:32px;border-radius:8px}
.top .ib:hover:not([disabled]){background:rgba(255,255,255,.08);color:#fff}
.top .mpill .ib{width:28px;height:28px;border-radius:7px}
.top .dchip{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#c3cbdb}
.top .switch{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#e6ebf5;box-shadow:none}
.top .switch .k{background:rgba(255,255,255,.2)}
.top .switch[aria-pressed=true]{background:rgba(124,150,255,.2);border-color:#8aa2ff;color:#fff}
.top .switch[aria-pressed=true] .k{background:#6f8cff}
.top2{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.03)}
.t2{display:flex;align-items:stretch;height:50px}
.gnav{display:flex;align-items:stretch;justify-content:space-between;gap:28px;width:100%;overflow-x:auto;scrollbar-width:none}
.gnav::-webkit-scrollbar{display:none}
.ng{display:flex;align-items:stretch;gap:2px;flex:none}
.nl{align-self:center;font-size:11.5px;font-weight:700;color:var(--faint);margin-right:8px;white-space:nowrap}
.ng.c .nl{color:var(--com);background:var(--com-soft);border-radius:6px;padding:2px 8px}
.gnav button{position:relative;border:0;background:none;padding:0 12px;font-size:14.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .12s}
.gnav button:hover{color:var(--ink)}
.gnav button[aria-current=true]{color:var(--ink);font-weight:700}
.gnav button[aria-current=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:var(--accent)}
.gnav button.c[aria-current=true]{color:var(--com)}
.gnav button.c[aria-current=true]::after{background:var(--com)}
/* page head: small context tag above the title */
.kicker{display:inline-flex!important;align-items:center;gap:6px;font-size:12px;font-weight:650;border-radius:6px;padding:3px 9px;margin-bottom:10px;background:var(--accent-soft);color:var(--accent)!important}
.kicker svg.i{width:14px;height:14px}
.c-page .kicker{background:var(--com-soft);color:var(--com)!important}
.hero-in{padding-block:26px 0}
@media (max-width:1100px){.top .dchip{display:none}.gnav{gap:20px}.gnav button{padding:0 9px;font-size:14px}}
@media (max-width:900px){
  .shell .wrap,.top .wrap{padding-left:16px;padding-right:16px}
  .top{top:-54px}.t1{height:54px;gap:10px}
  .top .logo small{display:none}
  .t2{height:46px}
}
@media (max-width:600px){
  .top .logo .lt{display:none}
  .top .mpill select{max-width:130px;font-size:13px}
  .top .switch .t{display:none}
}
@media (max-width:760px){
  .top{top:-54px}
  .t2{height:auto}
  .gnav{flex-direction:column;gap:0;overflow:visible}
  .ng{overflow-x:auto;scrollbar-width:none;height:42px}
  .ng::-webkit-scrollbar{display:none}
  .ng.c{border-top:1px solid var(--line)}
  .nl{min-width:44px}
  .gnav button{font-size:14px;padding:0 9px}
  .wday .ev.dot{padding-left:0}
  .wday .ev.dot::before{display:none}
}

/* 영업월 달력: 시작·종료 표시 */

/* ===== v14: 에디토리얼 스타일 (참고: kt cloud TECH UP). 유리 같은 흰 패널 · 로즈 강조 · 크고 굵은 제목 · 검은 선택 탭 ===== */

}

  --bg:#0f1013;--surface:#17191e;--sunk:#1c1e24;--head:#22252c;--ink:#f2f3f5;--ink2:#d2d4d9;--muted:#9a9ea6;--faint:#6b6f77;
  --line:#272a31;--line-strong:#343841;--th:#1b1d22;--rowh:#1e1a1d;--pri:#f2f3f5;--glass:rgba(23,25,30,.8);--glass-line:rgba(255,255,255,.06);
  --sh-card:0 16px 50px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.04)}}
:root[data-theme="dark"]{
  --accent:#ff6f9c;--accent-ink:#1a0a10;--accent-soft:#3a1a26;--accent-line:#5e2a3d;
  --bg:#0f1013;--surface:#17191e;--sunk:#1c1e24;--head:#22252c;--ink:#f2f3f5;--ink2:#d2d4d9;--muted:#9a9ea6;--faint:#6b6f77;
  --line:#272a31;--line-strong:#343841;--th:#1b1d22;--rowh:#1e1a1d;--pri:#f2f3f5;--glass:rgba(23,25,30,.8);--glass-line:rgba(255,255,255,.06);
  --sh-card:0 16px 50px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.04)}
body{background:radial-gradient(circle at 8% 4%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 26rem),linear-gradient(var(--bg),color-mix(in srgb,var(--bg) 60%,#fafaf8) 45%,var(--bg));background-attachment:fixed;letter-spacing:-.014em}

/* --- 페이지 머리: 둥근 큰 패널 + 격자 + 로즈 빛 + 큰 제목 --- */
.hero,.c-page .hero{position:relative;overflow:hidden;width:min(1480px,calc(100% - 24px));margin:12px auto 0;border-radius:32px;border:1px solid var(--glass-line);
  background:linear-gradient(90deg,rgba(20,22,28,.035) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(rgba(20,22,28,.035) 1px,transparent 1px) 0 0/64px 64px,
  radial-gradient(circle at 88% 10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 22rem),
  linear-gradient(135deg,color-mix(in srgb,var(--surface) 96%,var(--accent)),var(--surface) 55%,color-mix(in srgb,var(--surface) 94%,var(--accent2)));
  box-shadow:0 24px 70px rgba(17,20,28,.07)}

  radial-gradient(circle at 88% 10%,color-mix(in srgb,var(--com) 16%,transparent),transparent 22rem),linear-gradient(135deg,color-mix(in srgb,var(--surface) 95%,var(--com)),var(--surface) 60%)}

.hero h1{font-size:clamp(32px,3.8vw,48px);font-weight:850;letter-spacing:-.055em;line-height:1.1;text-wrap:balance}
.hero h1::after{content:"";display:inline-block;width:.2em;height:.2em;margin-left:.1em;border-radius:50%;background:var(--accent);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 70%,transparent)}

.hero p{margin-top:12px;font-size:14.5px;color:var(--muted);padding-left:14px;border-left:3px solid color-mix(in srgb,var(--accent) 70%,transparent);max-width:68ch}

.revline{padding-left:17px}
.subtabs{display:inline-flex;gap:3px;margin:24px 0 22px;padding:4px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:0 10px 30px rgba(16,21,31,.05),inset 0 0 0 1px rgba(29,33,41,.04);max-width:100%;overflow-x:auto}

main{padding-block:22px 120px}

.card,.mc{border-radius:var(--r-card);border:1px solid var(--glass-line);background:var(--surface);box-shadow:var(--sh-card)}

/* ===== v15: 블랙 / 화이트 ===== */
:root{

  --com:#f5f5f5;--com-soft:#222;--com-line:#3a3a3a;--pri:#f5f5f5;--hl:#1e1e1e;
  --bg:#0c0c0c;--surface:#151515;--sunk:#1a1a1a;--head:#202020;--ink:#f5f5f5;--ink2:#d4d4d4;--muted:#9a9a9a;--faint:#666;
